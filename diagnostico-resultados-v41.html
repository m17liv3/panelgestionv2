<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>M17LIV3 · Diagnóstico resultados</title>
<style>
body{margin:0;background:#050812;color:#eef8ff;font:15px/1.45 system-ui,Segoe UI,sans-serif;padding:24px}main{max-width:1100px;margin:auto}h1{color:#77ff58}h2{color:#00e5ff;margin-top:28px}.box{background:#0b1422;border:1px solid #24405a;border-radius:14px;padding:14px;margin:10px 0}pre{white-space:pre-wrap;word-break:break-word;background:#07101c;border-radius:10px;padding:12px;color:#cfeaff}.ok{color:#77ff58}.bad{color:#ff8da1}.warn{color:#ffd761}button{background:#0c2118;border:1px solid #4bc83a;color:#77ff58;border-radius:12px;padding:12px 18px;font-weight:800;cursor:pointer}.muted{color:#8da3b8}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:760px){.row{grid-template-columns:1fr}}
</style>
</head>
<body><main>
<h1>DIAGNÓSTICO PRIVADO · RESULTADOS</h1>
<p class="muted">No publica ni modifica nada. Solo lee la cartelera actual y las respuestas de resultados para localizar exactamente el fallo.</p>
<button id="run">EJECUTAR DIAGNÓSTICO</button>
<div id="out"><div class="box">Pulsa el botón.</div></div>
</main>
<script src="config.js"></script>
<script>
(() => {
const API='https://qjbnjhojwhcndcfjcyrc.supabase.co/functions/v1/resultados-dia';
const cfg=window.M17_CONFIG||{}, BIN_ID=cfg.cartBinId||'', BIN_KEY=cfg.cartKey||'';
const $=s=>document.querySelector(s); const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function localDate(off=0){const d=new Date();d.setDate(d.getDate()+off);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function normalize(v){return String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim()}
function sim(a,b){a=normalize(a);b=normalize(b);if(!a||!b)return 0;if(a===b)return 1;if(a.includes(b)||b.includes(a))return .92;const A=a.split(' ').filter(x=>x.length>1),B=b.split(' ').filter(x=>x.length>1);let hit=0;for(const x of A){if(B.some(y=>x===y||(x.length>=4&&y.length>=4&&(x.startsWith(y)||y.startsWith(x)))))hit++}return A.length&&B.length?hit/Math.max(A.length,B.length):0}
function sportMap(s){const t=String(s||'').toLowerCase();if(/tenis|tennis|atp|wta/.test(t))return 'Tennis';if(/foot|soccer|futbol|fútbol/.test(t))return 'Football';if(/basket/.test(t))return 'Basketball';if(/cicl/.test(t))return 'Cycling';if(/golf/.test(t))return 'Golf';if(/moto|motogp|formula|f1/.test(t))return 'Motorsport';if(/padel|pádel/.test(t))return 'Padel';return 'Unknown'}
function cleanParticipant(v){let s=String(v||'').replace(/\s+(?:📺|🗂)\s*(?:CANAL|CARPETA)?\s*:?.*$/i,'').replace(/\s+[|·]\s+.*$/,'').trim();const flags=[...s.matchAll(/[\u{1F1E6}-\u{1F1FF}]{2}\s*/gu)];if(flags.length){const m=flags[flags.length-1];s=s.slice((m.index||0)+m[0].length).trim()}return s.replace(/^[^\p{L}\p{N}]+/u,'').trim()}
function parseText(text){let current='Unknown',out=[];for(const raw of String(text||'').split(/\r?\n/)){let line=raw.replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim();if(!line)continue;if(!/^⏰/.test(line)&&!/^\d{1,2}[:.]\d{2}/.test(line)){const h=sportMap(line);if(h!=='Unknown'&&!/^📺|^🗂/.test(line)&&line.length<90)current=h;continue}const tm=(line.match(/(?:^|⏰\s*)([0-2]?\d[:.][0-5]\d)/)||[])[1]||'';let title=line.replace(/^\s*⏰\s*[0-2]?\d[:.][0-5]\d\s*[-–—|·:]?\s*/,'').replace(/^\s*[0-2]?\d[:.][0-5]\d\s*[-–—|·:]?\s*/,'').trim();let home='',away='',type='event';const sep=title.match(/\s*(?:🆚|\bvs\.?\b|\bv\.?\b|\bcontra\b)\s*/i);if(sep){let left=title.slice(0,sep.index).trim(),right=title.slice(sep.index+sep[0].length).trim();if(left.includes(':'))left=left.split(':').pop().trim();home=cleanParticipant(left);away=cleanParticipant(right);if(home&&away)type='match'}out.push({sport:current,type,title,home,away,time:tm.replace('.',':'),sourceLine:line})}return out}
async function published(){const r=await fetch(`https://api.jsonbin.io/v3/b/${encodeURIComponent(BIN_ID)}/latest?_=${Date.now()}`,{cache:'no-store',headers:{'X-Master-Key':BIN_KEY,'X-Access-Key':BIN_KEY}});const j=await r.json();return {status:r.status,record:j.record||{}}}
async function api(date){const r=await fetch(`${API}?date=${date}&sports=Tennis&force=1`,{cache:'no-store'});let j={};try{j=await r.json()}catch{}return {http:r.status,json:j}}
function candidatesFromApi(j){const all=[];const push=(arr,where)=>{for(const e of (Array.isArray(arr)?arr:[])){const txt=`${e.away||''} ${e.home||''}`.toLowerCase();if(/lehecka|jodar|jódar/.test(txt))all.push({where,...e})}};push(j?.events,'top-level finished events');push(j?.tennis?.ATP?.events,'tennis.ATP.events');push(j?.tennis?.WTA?.events,'tennis.WTA.events');return all}
function bestMatch(offered,apiEvents){let best=null,score=-1;for(const e of apiEvents){const d=(sim(offered.home,e.away)+sim(offered.away,e.home))/2;const s=(sim(offered.home,e.home)+sim(offered.away,e.away))/2;const v=Math.max(d,s);if(v>score){score=v;best={score:v,direct:d,swapped:s,event:e}}}return best}
function block(title,obj,cls=''){return `<h2>${esc(title)}</h2><div class="box ${cls}"><pre>${esc(JSON.stringify(obj,null,2))}</pre></div>`}
async function run(){const out=$('#out');out.innerHTML='<div class="box">Ejecutando… puede tardar unos segundos.</div>';try{
 const p=await published(); const rec=p.record||{}; const parsed=parseText(rec.texto||'');
 const wanted=parsed.filter(e=>/lehecka|jodar|jódar/i.test(`${e.home} ${e.away} ${e.sourceLine}`));
 const today=localDate(), prev=localDate(-1);
 const aToday=await api(today); await new Promise(r=>setTimeout(r,1600)); const aPrev=await api(prev);
 const cToday=candidatesFromApi(aToday.json), cPrev=candidatesFromApi(aPrev.json), cAll=[...cToday,...cPrev];
 const offer=wanted.find(e=>e.type==='match')||wanted[0]||null; const best=offer?bestMatch(offer,cAll):null;
 const summary={browserLocalDate:today,publishedDate:rec.eventos_fecha||'',publishedTextLength:String(rec.texto||'').length,parsedEvents:parsed.length,leheckaJodarParsed:wanted,apiToday:{date:today,http:aToday.http,topEvents:aToday.json?.events?.length||0,ATP:{ok:aToday.json?.tennis?.ATP?.ok,status:aToday.json?.tennis?.ATP?.status,total:aToday.json?.tennis?.ATP?.total,finished:aToday.json?.tennis?.ATP?.finished,error:aToday.json?.tennis?.ATP?.error},WTA:{ok:aToday.json?.tennis?.WTA?.ok,status:aToday.json?.tennis?.WTA?.status,total:aToday.json?.tennis?.WTA?.total,finished:aToday.json?.tennis?.WTA?.finished,error:aToday.json?.tennis?.WTA?.error}},apiPrevious:{date:prev,http:aPrev.http,topEvents:aPrev.json?.events?.length||0,ATP:{ok:aPrev.json?.tennis?.ATP?.ok,status:aPrev.json?.tennis?.ATP?.status,total:aPrev.json?.tennis?.ATP?.total,finished:aPrev.json?.tennis?.ATP?.finished,error:aPrev.json?.tennis?.ATP?.error},WTA:{ok:aPrev.json?.tennis?.WTA?.ok,status:aPrev.json?.tennis?.WTA?.status,total:aPrev.json?.tennis?.WTA?.total,finished:aPrev.json?.tennis?.WTA?.finished,error:aPrev.json?.tennis?.WTA?.error}},apiCandidates:cAll,bestMatch:best?{score:best.score,direct:best.direct,swapped:best.swapped,event:{status:best.event.status,away:best.event.away,home:best.event.home,score_away:best.event.score_away,score_home:best.event.score_home,sets_away:best.event.sets_away,sets_home:best.event.sets_home,event_date:best.event.event_date}}:null};
 let verdict=''; if(!wanted.length)verdict='FALLO: la cartelera publicada no está parseando Lehecka–Jódar.'; else if(!cAll.length)verdict='FALLO: la API no está devolviendo Lehecka–Jódar ni para hoy ni para ayer.'; else if(!best||best.score<.62)verdict='FALLO: API y cartelera existen, pero el comparador no alcanza el umbral.'; else verdict='DIAGNÓSTICO: cartelera + API + comparación sí coinciden. El fallo está en otro punto del flujo de resultados.html.';
 out.innerHTML=`<h2>VEREDICTO</h2><div class="box ${verdict.startsWith('DIAGNÓSTICO')?'ok':'bad'}"><b>${esc(verdict)}</b></div>`+block('RESUMEN COMPLETO',summary);
 }catch(e){out.innerHTML=`<div class="box bad"><b>Error:</b> ${esc(e.message||e)}</div>`}}
$('#run').addEventListener('click',run);run();
})();
</script></body></html>
