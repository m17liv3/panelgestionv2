<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M17LIV3 · Diagnóstico snapshot V46</title><style>body{margin:0;background:#050812;color:#eef8ff;font-family:system-ui;padding:24px}.wrap{max-width:1200px;margin:auto}h1{font-size:clamp(28px,5vw,56px);text-align:center}button{padding:12px 18px;border-radius:12px;border:1px solid #00dfff;background:#071827;color:#00e5ff;font-weight:800}.box{background:#0b1422;border:1px solid #22364c;border-radius:16px;padding:16px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:12px}.card{background:#08111f;border:1px solid #20344a;border-radius:14px;padding:14px}.k{color:#77ff58}.muted{color:#8da3b8}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;line-height:1.4}.bad{color:#ffb15c}</style></head><body><main class="wrap"><h1>DIAGNÓSTICO SNAPSHOT · V46</h1><p class="muted" style="text-align:center">No consulta APIs deportivas y no modifica nada.</p><button id="run">LEER SNAPSHOT</button><div id="summary" class="box">Sin ejecutar.</div><div id="items" class="grid"></div></main><script src="config.js"></script><script>(function(){const $=s=>document.querySelector(s);const cfg=window.M17_CONFIG||{};const id=cfg.cartBinId||'';const key=cfg.cartKey||'';const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function norm(v){return String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}function sportGuess(o){const s=[o.sport,o.deporte,o.category,o.section,o.title,o.sourceLine].map(x=>String(x||'')).join(' ');const t=norm(s);if(/futbol|football|soccer|champions|laliga|premier|serie a|bundesliga|mundial|amistoso|pretemporada/.test(t))return 'Football';if(/tenis|tennis|atp|wta|montreal/.test(t))return 'Tennis';if(/padel|pádel/.test(t))return 'Padel';if(/basket|baloncesto|nba|acb/.test(t))return 'Basketball';if(/golf/.test(t))return 'Golf';if(/cicl/.test(t))return 'Cycling';if(/moto|motogp|formula|f1/.test(t))return 'Motorsport';return 'Unknown'}async function run(){try{$('#summary').textContent='Leyendo…';const r=await fetch(`https://api.jsonbin.io/v3/b/${encodeURIComponent(id)}/latest?_=${Date.now()}`,{cache:'no-store',headers:{'X-Master-Key':key,'X-Access-Key':key}});const j=await r.json(),rec=j.record||{};const snap=Array.isArray(rec.resultados_eventos)?rec.resultados_eventos:(Array.isArray(rec.eventos_datos)?rec.eventos_datos:[]);const counts={};for(const o of snap){const g=sportGuess(o);counts[g]=(counts[g]||0)+1}$('#summary').innerHTML=`<b>Fecha:</b> ${esc(rec.resultados_fecha||rec.eventos_fecha||'')} · <b>Snapshot:</b> <span class="k">${snap.length}</span> · <b>Texto:</b> ${String(rec.resultados_texto||rec.texto||'').length} caracteres<br><b>Clasificación tentativa:</b> ${esc(JSON.stringify(counts))}<br><span class="bad">Necesito ver cómo vienen realmente los campos de los eventos.</span>`;$('#items').innerHTML=snap.map((o,i)=>`<article class="card"><b>#${i+1}</b> · guess <span class="k">${esc(sportGuess(o))}</span><pre>${esc(JSON.stringify(o,null,2))}</pre></article>`).join('');}catch(e){$('#summary').textContent='ERROR: '+(e?.message||e)}}$('#run').addEventListener('click',run);run();})();</script></body></html>
