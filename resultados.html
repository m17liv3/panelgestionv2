<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050914">
<title>M17LIV3 · Resultados cartelera</title>
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<style>
:root{
  --bg:#050914;
  --panel:#0c1422;
  --panel2:#101b2c;
  --text:#eef7ff;
  --muted:#7f9ab2;
  --cyan:#00d8ff;
  --green:#6cff43;
  --border:rgba(134,188,224,.16);
  --safe:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{min-height:100%;background:var(--bg)}
body{
  min-height:100vh;margin:0;color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 50% -8%,rgba(0,216,255,.16),transparent 31rem),
    radial-gradient(circle at 100% 34%,rgba(108,255,67,.07),transparent 25rem),
    linear-gradient(180deg,#07101e 0%,#050914 52%,#03060d 100%);
  user-select:none;-webkit-user-select:none;overflow-x:hidden
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;
  background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:26px 26px;
  mask-image:linear-gradient(to bottom,#000,transparent 75%)
}
.page{
  position:relative;width:min(920px,100%);margin:0 auto;
  padding:14px 15px calc(34px + var(--safe))
}
.intro{
  margin-bottom:14px;padding:17px 18px;
  border:1px solid var(--border);border-radius:20px;
  background:linear-gradient(145deg,rgba(14,29,48,.86),rgba(8,15,27,.88));
  box-shadow:0 18px 55px rgba(0,0,0,.28),inset 0 1px rgba(255,255,255,.035)
}
.eyebrow{
  color:var(--cyan);font-size:.68rem;font-weight:900;
  letter-spacing:.18em;text-transform:uppercase
}
.heroTitleRow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:6px}
.heroCount{
  font-size:clamp(2.8rem,9vw,4rem);line-height:1;
  font-weight:1000;letter-spacing:-.05em;color:var(--cyan)
}
.heroLabel{
  font-size:clamp(2rem,6vw,3.35rem);line-height:1.02;
  font-weight:950;letter-spacing:-.05em;color:var(--text)
}
.dateLine{
  margin-top:6px;color:var(--text);font-size:1.02rem;text-transform:capitalize
}
.trackingLine{
  margin-top:9px;
  color:#8eabbc;
  font-size:.72rem;
  font-weight:850;
  letter-spacing:.04em
}


/* Estado de sincronización: mismo lenguaje visual que la cartelera */
.syncBar{
  display:flex;align-items:center;gap:10px;min-height:48px;
  padding:11px 14px;margin-bottom:14px;
  border:1px solid var(--border);border-radius:16px;
  color:var(--muted);background:rgba(12,20,34,.76)
}
.liveDot{
  width:9px;height:9px;border-radius:50%;flex:0 0 9px;
  background:var(--green);animation:syncPulse 1.45s infinite
}
.syncBar.done .liveDot{background:#718691;animation:none}
.syncMain{color:#dffcff;font-size:.78rem;font-weight:900}
.syncSub{font-size:.75rem;color:var(--muted)}
.updatedText{margin-left:auto;color:#6f8799;font-size:.70rem;white-space:nowrap}
@keyframes syncPulse{
  0%{box-shadow:0 0 0 0 rgba(108,255,67,.40);transform:scale(.95)}
  60%{box-shadow:0 0 0 9px rgba(108,255,67,0);transform:scale(1.08)}
  100%{box-shadow:0 0 0 0 rgba(108,255,67,0);transform:scale(.95)}
}

.newResultsBanner{
  display:none;align-items:center;gap:9px;
  margin:-4px 0 14px;padding:9px 12px;width:max-content;max-width:100%;
  border:1px solid rgba(108,255,67,.26);border-radius:999px;
  background:rgba(108,255,67,.075);color:#eaffdb;
  font-size:.77rem;font-weight:900
}
.newResultsBanner.show{display:inline-flex}
.newPulse{width:8px;height:8px;border-radius:50%;background:var(--green);animation:syncPulse 1.05s infinite}

/* Panel de resultados, calcado al lenguaje de la tabla de cartelera */
.resultsCard{
  overflow:hidden;margin-bottom:15px;
  border:1px solid var(--border);border-radius:21px;
  background:linear-gradient(145deg,rgba(13,25,42,.92),rgba(7,13,24,.94));
  box-shadow:0 22px 60px rgba(0,0,0,.32),inset 0 1px rgba(255,255,255,.035)
}
.sectionLabel{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:11px 16px;color:var(--cyan);
  font-size:.67rem;font-weight:900;letter-spacing:.18em;text-transform:uppercase;
  border-bottom:1px solid var(--border);
  background:linear-gradient(90deg,rgba(0,216,255,.09),rgba(108,255,67,.035))
}
.sectionLabel .right{color:var(--green);letter-spacing:.08em}
.resultsTableWrap{width:100%;overflow:hidden}
.resultsTable{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}
.resultsTable thead th{
  padding:12px 14px;color:var(--cyan);font-size:.68rem;font-weight:900;
  letter-spacing:.12em;text-transform:uppercase;text-align:left;
  background:rgba(0,216,255,.045);border-bottom:1px solid var(--border)
}
.resultsTable td{
  padding:12px 14px;border-top:1px solid rgba(255,255,255,.045);
  vertical-align:middle;font-size:.9rem
}
.resultsTable tbody tr:nth-child(even){background:rgba(255,255,255,.012)}
.timeCell{width:72px;color:var(--cyan);font-size:.96rem;font-weight:950;white-space:nowrap}
.eventCell{color:var(--text);font-weight:850;line-height:1.35;white-space:normal;overflow-wrap:anywhere}
.eventSub{
  display:block;margin-top:3px;color:#7f9ab2;font-size:.70rem;font-weight:700;
  white-space:normal
}
.setsLine{display:block;margin-top:4px;color:#9fd9e8;font-size:.72rem;font-weight:800}
.scoreCell{
  width:105px;text-align:center;color:#fff;font-size:1.05rem;font-weight:1000;white-space:nowrap
}
.statusCell{width:125px;text-align:right;padding-right:14px!important}
.statusPill{
  display:inline-flex;align-items:center;gap:7px;padding:5px 8px;border-radius:999px;
  color:#d6ffd1;background:rgba(96,255,102,.07);
  border:1px solid rgba(96,255,102,.20);
  font-size:.64rem;font-weight:900;letter-spacing:.035em;text-transform:uppercase;white-space:nowrap
}
.statusPill.pending{
  color:#dffcff;background:rgba(0,216,255,.055);
  border-color:rgba(0,216,255,.18)
}
.statusPill.pending .statusDot{
  background:var(--cyan);
  animation:syncPulse 1.55s infinite
}
.statusPill.soon{
  color:#efffd0;background:rgba(108,255,67,.075);
  border-color:rgba(108,255,67,.22)
}
.statusPill.soon .statusDot{
  background:var(--green);
  animation:syncPulse 1.05s infinite
}
.statusPill.live{
  color:#d6ffd1;background:rgba(96,255,102,.09);
  border-color:rgba(96,255,102,.28)
}
.statusPill.live .statusDot{
  background:#62ff6e;
  animation:syncPulse .9s infinite
}
.statusPill.finished{
  color:#d6ffd1;background:rgba(96,255,102,.07);
  border-color:rgba(96,255,102,.20)
}
.statusPill.finished .statusDot{background:#62ff6e}
.scoreCell.pendingScore{color:#718a9b}

.statusDot{width:7px;height:7px;border-radius:50%;background:#62ff6e}
.groupRow td{
  padding:10px 14px;color:#e9fbff;font-size:.82rem;font-weight:950;letter-spacing:.05em;
  background:linear-gradient(90deg,rgba(0,216,255,.08),rgba(108,255,67,.035));
  border-top:1px solid rgba(0,216,255,.13);
  border-bottom:1px solid rgba(0,216,255,.08)
}
.groupRow small{margin-left:8px;color:var(--muted);font-size:.68rem;font-weight:750}
.newRow{background:linear-gradient(90deg,rgba(108,255,67,.075),rgba(0,216,255,.025))!important}
.newBadge{
  display:inline-flex;margin-left:7px;padding:3px 6px;border-radius:999px;
  background:var(--green);color:#102000;font-size:.57rem;font-weight:1000;
  letter-spacing:.06em;vertical-align:middle
}
.empty,.error,.loading{
  padding:34px 20px;text-align:center;color:var(--muted)
}
.error{color:#ff9cab}
.footer{
  padding:10px 4px 0;text-align:center;color:rgba(127,154,178,.72);
  font-size:.72rem;line-height:1.55
}
.hiddenCounters{display:none!important}

.resultsTable th:last-child,.resultsTable td:last-child{padding-right:14px}
@media(min-width:761px){
  .page{padding-top:28px}
  .intro{padding:22px 24px}
  .resultsTableWrap{overflow:hidden}
  .resultsTable{min-width:0}
  .resultsTable th,.resultsTable td{box-sizing:border-box}
}
@media(max-width:760px){
  .resultsTable thead{display:none}
  .resultsTable,.resultsTable tbody,.resultsTable tr,.resultsTable td{display:block;width:100%}
  .resultsTable tbody tr{padding:10px 13px}
  .resultsTable td{padding:3px 0;border:0!important}
  .timeCell{font-size:1rem}
  .eventCell{font-size:.93rem}
  .scoreCell{width:auto;text-align:left;font-size:1.12rem;padding-top:6px}
  .statusCell{width:auto;text-align:left;padding-top:6px!important}
  .groupRow{padding:0!important}
  .groupRow td{padding:9px 13px!important}
  .syncBar{flex-wrap:wrap}
  .updatedText{width:100%;margin-left:19px}
}
html,body,body *{-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none}
body *::selection{background:transparent!important;color:inherit!important}
body *::-moz-selection{background:transparent!important;color:inherit!important}
[hidden]{display:none!important}
</style>
</head>
<body oncontextmenu="return false">
<main class="page">
  <section class="intro">
    <div class="eyebrow">Programación premium</div>
    <div class="heroTitleRow">
      <span id="heroResultCount" class="heroCount">0</span>
      <span class="heroLabel">eventos de hoy</span>
    </div>
    <div id="dateText" class="dateLine"></div>
    <div class="trackingLine">SEGUIMIENTO DE RESULTADOS · ⚽ Fútbol · 🎾 Tenis · 🏀 Baloncesto</div>
  </section>

  <div class="syncBar" id="liveStatus">
    <span class="liveDot"></span>
    <strong id="liveStatusMain" class="syncMain">Cargando resultados…</strong>
    <span id="liveStatusSub" class="syncSub">comprobando novedades</span>
    <span id="updatedText" class="updatedText"></span>
  </div>

  <div class="newResultsBanner" id="newResultsBanner">
    <span class="newPulse"></span>
    <span id="newResultsText">Nuevo resultado añadido</span>
  </div>

  <section class="resultsCard">
    <div class="sectionLabel">
      <span>Resultados</span>
      <span class="right">M17LIV3</span>
    </div>
    <div id="content">
      <div class="loading">Preparando resultados…</div>
    </div>
  </section>

  <!-- Se conservan porque la lógica existente los actualiza, pero no son visibles. -->
  <div class="hiddenCounters" aria-hidden="true">
    <span id="countFinal">0</span>
    <span id="countDay">0</span>
  </div>

  <footer class="footer">
    M17LIV3 · Tu entretenimiento en un solo lugar
  </footer>
</main>
<script src="config.js"></script>
<script>
 // M17LIV3 resultados V64.4 · filtro estricto deportes con API
(function(){
 const API_PROXY='https://qjbnjhojwhcndcfjcyrc.supabase.co/functions/v1/resultados-dia';
 const cfg=window.M17_CONFIG||{};
 const BIN_ID=cfg.cartBinId||'';
 const BIN_KEY=cfg.cartKey||'';
 // Fuentes automáticas activas. V56: tenis con caché compartida + ventanas por partido. Fútbol usa football-data.org y respaldo SportScore con validación estricta.
 const SUPPORTED=new Set(['Football','Tennis','Basketball']);
 const ICONS={Football:'⚽',Tennis:'🎾',Basketball:'🏀',Baseball:'⚾',Hockey:'🏒',Handball:'🤾',Volleyball:'🏐',NFL:'🏈',Rugby:'🏉',Padel:'🎾',Cycling:'🚴',Golf:'⛳',Motorsport:'🏍️',Swimming:'🏊',Unknown:'•'};
 let matches=[],offered=[];
 const $=s=>document.querySelector(s);
 const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
 function localDate(offsetDays=0){const d=new Date();d.setDate(d.getDate()+offsetDays);const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
 function isEarlyTime(t){const m=String(t||'').match(/^(\d{1,2}):(\d{2})$/);if(!m)return false;const mins=Number(m[1])*60+Number(m[2]);return mins<180}
 function timeMins(t){const m=String(t||'').match(/^(\d{1,2}):(\d{2})$/);return m?Number(m[1])*60+Number(m[2]):null}
 function madridNow(){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Madrid',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());const get=t=>parts.find(p=>p.type===t)?.value||'';const hour=Number(get('hour'))%24,minute=Number(get('minute'));return {date:`${get('year')}-${get('month')}-${get('day')}`,mins:hour*60+minute}}
 function tennisMatchesForGate(list){return (list||[]).filter(o=>sportMap(o.sport)==='Tennis'&&o.type==='match'&&o.home&&o.away&&timeMins(o.time)!=null)}
 function tennisSignature(list){return tennisMatchesForGate(list).map(o=>`${o.time}|${normalize(o.home)}|${normalize(o.away)}`).sort().join('||')}
 function tennisDoneKey(list,date){const sig=tennisSignature(list);return sig?`m17liv3_tennis_done_${date}_${sig}`:''}
 function tennisAlreadyDone(list,date){const key=tennisDoneKey(list,date);if(!key)return false;try{return localStorage.getItem(key)==='1'}catch{return false}}
 function tennisEventKey(o){return `${o.time}|${normalize(o.home)}|${normalize(o.away)}`}
 function foundTennisKeys(found){const set=new Set();for(const x of (found||[])){if(sportMap(x?.api?.sport)!=='Tennis')continue;const o=x?.offered;if(o?.home&&o?.away)set.add(tennisEventKey(o))}return set}
 /*
   V56 · VENTANAS POR PARTIDO
   Primera comprobación: 45 min después de la hora publicada.
   Si todavía no está finalizado, la caché persistente limita los
   reintentos reales de TheRundown a uno cada 30 min.

   Lo importante: si un partido ya está encontrado y el siguiente
   aún no ha llegado a +45 min, NO se refresca TheRundown.
 */
 function tennisRefreshDecision(list,found,date){
   const wanted=tennisMatchesForGate(list);
   if(!wanted.length)return {shouldRefresh:false,allResolved:false,reason:'no_matches',unresolved:[]};

   const resolved=foundTennisKeys(found);
   const unresolved=wanted.filter(o=>!resolved.has(tennisEventKey(o)));

   if(!unresolved.length){
     return {shouldRefresh:false,allResolved:true,reason:'all_resolved',unresolved:[]};
   }

   const now=madridNow();

   if(date>now.date){
     return {shouldRefresh:false,allResolved:false,reason:'future_date',unresolved};
   }

   if(date<now.date){
     return {shouldRefresh:true,allResolved:false,reason:'past_date_unresolved',unresolved};
   }

   const eligible=unresolved.filter(o=>{
     const start=timeMins(o.time);
     return start!=null&&now.mins>=start+45;
   });

   if(!eligible.length){
     const next=unresolved
       .map(o=>({event:o,start:timeMins(o.time)}))
       .filter(x=>x.start!=null)
       .sort((a,b)=>a.start-b.start)[0];

     return {
       shouldRefresh:false,
       allResolved:false,
       reason:'waiting_for_next_window',
       unresolved,
       nextTime:next?.event?.time||''
     };
   }

   return {
     shouldRefresh:true,
     allResolved:false,
     reason:'unresolved_in_query_window',
     unresolved,
     eligible
   };
 }
 function markTennisDone(list,found,date){const wanted=tennisMatchesForGate(list);if(!wanted.length)return false;const resolved=foundTennisKeys(found);if(resolved.size<wanted.length)return false;const key=tennisDoneKey(list,date);if(!key)return false;try{const was=localStorage.getItem(key)==='1';localStorage.setItem(key,'1');return !was}catch{return false}}
 function formatDate(){return new Intl.DateTimeFormat('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date()).replace(/^./,c=>c.toUpperCase())}
 function normalize(v){return String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\b(fc|cf|afc|sc|ac|cd|ud|ue|sd|rc|club|deportivo|deportes|futbol|football|soccer|women|woman|femenino|femenina|team)\b/g,' ').replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim()}
 function toks(v){return normalize(v).split(' ').filter(x=>x.length>1)}
 function sim(a,b){a=normalize(a);b=normalize(b);if(!a||!b)return 0;if(a===b)return 1;if(a.includes(b)||b.includes(a))return .92;const A=toks(a),B=toks(b);if(!A.length||!B.length)return 0;let hit=0;for(const x of A){if(B.some(y=>x===y||(x.length>=4&&y.length>=4&&(x.startsWith(y)||y.startsWith(x)))))hit++}return hit/Math.max(A.length,B.length)}
 function sportMap(s){const t=String(s||'').toLowerCase();if(/padel|pádel/.test(t))return 'Padel';if(/tenis|tennis|atp|wta/.test(t))return 'Tennis';if(/cicl|cycling/.test(t))return 'Cycling';if(/golf/.test(t))return 'Golf';if(/moto|motogp|motocicl|formula|f1/.test(t))return 'Motorsport';if(/nataci|swim/.test(t))return 'Swimming';if(/basket|baloncesto/.test(t))return 'Basketball';if(/base|beisbol|béisbol/.test(t))return 'Baseball';if(/hockey/.test(t))return 'Hockey';if(/hand|balonmano/.test(t))return 'Handball';if(/volley|voleibol/.test(t))return 'Volleyball';if(/nfl|futbol americano|fútbol americano/.test(t))return 'NFL';if(/rugby/.test(t))return 'Rugby';if(/foot|soccer|futbol|fútbol/.test(t))return 'Football';return 'Unknown'}
 function cleanParticipant(v){let s=String(v||'').replace(/\s+(?:📺|🗂)\s*(?:CANAL|CARPETA)?\s*:?.*$/i,'').replace(/\s+[|·]\s+.*$/,'').trim();const flags=[...s.matchAll(/[\u{1F1E6}-\u{1F1FF}]{2}\s*/gu)];if(flags.length){const m=flags[flags.length-1];s=s.slice((m.index||0)+m[0].length).trim()}return s.replace(/^[^\p{L}\p{N}]+/u,'').trim()}
 function cleanOfferedEvent(o){if(!o||typeof o!=='object')return o;const x={...o};x.home=cleanParticipant(x.home);x.away=cleanParticipant(x.away);/* Compatibilidad con datos ya publicados por versiones anteriores: si el segundo participante quedó contaminado con CANAL/CARPETA, se limpia aquí sin exigir volver a publicar. */if((!x.home||!x.away)&&x.sourceLine){const t=parseText(x.sourceLine);if(t[0]&&t[0].type==='match'){x.home=cleanParticipant(t[0].home);x.away=cleanParticipant(t[0].away)}}return x}
 function parseText(text){let current='Unknown',out=[];for(const raw of String(text||'').split(/\r?\n/)){let line=raw.replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim();if(!line)continue;if(!/^⏰/.test(line)&&!/^\d{1,2}[:.]\d{2}/.test(line)){const h=sportMap(line);if(h!=='Unknown'&&!/^📺|^🗂/.test(line)&&line.length<90)current=h;continue}const tm=(line.match(/(?:^|⏰\s*)([0-2]?\d[:.][0-5]\d)/)||[])[1]||'';let title=line.replace(/^\s*⏰\s*[0-2]?\d[:.][0-5]\d\s*[-–—|·:]?\s*/,'').replace(/^\s*[0-2]?\d[:.][0-5]\d\s*[-–—|·:]?\s*/,'').trim();if(!title)continue;let home='',away='',type='event';const sep=title.match(/\s*(?:🆚|\bvs\.?\b|\bv\.?\b|\bcontra\b)\s*/i);if(sep){let left=title.slice(0,sep.index).trim(),right=title.slice(sep.index+sep[0].length).trim();if(left.includes(':'))left=left.split(':').pop().trim();home=cleanParticipant(left);away=cleanParticipant(right);if(home&&away)type='match'}out.push({sport:current,type,title,home,away,time:tm.replace('.',':'),sourceLine:line})}return out}
 async function loadPublished(){if(!BIN_ID||!BIN_KEY)return {events:[],text:'',date:''};const r=await fetch(`https://api.jsonbin.io/v3/b/${encodeURIComponent(BIN_ID)}/latest?_=${Date.now()}`,{cache:'no-store',headers:{'X-Master-Key':BIN_KEY,'X-Access-Key':BIN_KEY}});if(!r.ok)throw new Error('No se pudo leer la programación publicada');const j=await r.json(),rec=j.record||{};
   /* V42: resultados usa un snapshot propio creado al pulsar Guardar y publicar.
      Esto desacopla los resultados de otros campos de Cartelera que pueden cambiar
      después por generación de imágenes, previews u otras herramientas. */
   const snapDate=rec.resultados_fecha||rec.eventos_fecha||'';
   const snapText=(typeof rec.resultados_texto==='string')?rec.resultados_texto:(rec.texto||'');
   const snapStored=Array.isArray(rec.resultados_eventos)?rec.resultados_eventos:(Array.isArray(rec.eventos_datos)?rec.eventos_datos:[]);
   if(snapDate&&snapDate!==localDate())return {events:[],date:snapDate,text:snapText};
   const parsedFromText=parseText(snapText);

   /*
     V57.4 · RECLASIFICAR SNAPSHOT ANTIGUO

     resultados_eventos puede haberse guardado con una versión anterior
     del parser. En ese caso el bloque "BALONCESTO" puede existir en el
     texto correcto, pero el objeto almacenado conservar sport="Unknown"
     (o una clasificación vieja).

     El texto publicado es la referencia para deporte/tipo/equipos.
     Conservamos los demás campos del snapshot estructurado, pero
     superponemos la clasificación nueva haciendo match por hora + línea/título.
   */
   let list;

   if(snapStored.length && parsedFromText.length){

   const start=offeredStartDateTime(offeredItem);
   if(!start){
     return {kind:'pending',text:'No finalizado',score:false};
   }

   const diff=start.getTime()-Date.now();

   if(diff>30*60*1000){
     return {kind:'pending',text:humanRemaining(diff),score:false};
   }
   if(diff>0){
     return {kind:'soon',text:humanRemaining(diff),score:false};
   }

   // Sin resultado definitivo todavía: evitamos afirmar "en directo" demasiado tiempo.
   if(diff>=-120*60*1000){

   }

     Para selecciones de baloncesto priorizamos primero el slug REAL
     que usa SportScore. Antes generábamos primero variantes españolas
     y cortábamos la búsqueda a 12 slugs; "germany-women-vs-spain-women"
     quedaba demasiado atrás y nunca llegaba a consultarse.
   */
   if(sport==='basketball'){
     const arr=[];
     if(/\b(alemania|germany|deutschland)\b/.test(n))arr.push('germany-women','germany-w');
     if(/\b(espana|spain|spanien)\b/.test(n))arr.push('spain-women','spain-w');
     const base=ssSlug(team,false);
     if(base)arr.push(`${base}-women`,`${base}-w`,base);
     return [...new Set(arr)].filter(Boolean);
   }
   const set=new Set([ssSlug(team,false),ssSlug(team,true)]);
   if(n.includes('atletico madrid'))set.add('atletico-madrid');
   if(n.includes('manchester city'))set.add('manchester-city');
   return [...set].filter(Boolean)
 }
 function ssValidate(diag,ev,targetDate){if(!diag||!diag.score||!ssFinished(diag.status)||!diag.bestTemporal)return false;if(diag.bestTemporal.date!==targetDate)return false;if(diag.bestTemporal.diff==null||diag.bestTemporal.diff>30)return false;return true}
 async function ssProbe(ev,targetDate,recent){
   const mapped=sportMap(ev.sport);
   const ssSport=mapped==='Basketball'?'basketball':'football';
   const cand=[];
   if(recent&&ssHasTeams(recent,ev.home,ev.away)){
     const d=ssSelect(recent,ev,targetDate);
     if(d)cand.push({diag:d,kind:'recent'});
   }
   const A=ssVariants(ev.home,ssSport),B=ssVariants(ev.away,ssSport),slugs=[];
   for(const a of A)for(const b of B)slugs.push(`${a}-vs-${b}`,`${b}-vs-${a}`);
   /*
     V57:
     En baloncesto damos prioridad al endpoint específico /match/.
     Es el que validamos con Alemania Women 60-65 España Women y evita
     mezclar marcadores de otros partidos presentes en una página de equipo.
   */
   const maxSlugs=ssSport==='basketball'?12:6;
   for(const slug of [...new Set(slugs)].slice(0,maxSlugs)){
     const r=await ssGet(`https://sportscore.com/api/widget/match/?sport=${ssSport}&slug=${encodeURIComponent(slug)}&src=${SPORT_SCORE_SRC}`);
     if(r.ok&&ssHasTeams(r.data,ev.home,ev.away)){
       const d=ssSelect(r.data,ev,targetDate);
       if(d)cand.push({diag:d,kind:'match'});
     }
   }
   /*
     Para fútbol conservamos el fallback por equipo de V51.
     Para baloncesto NO usamos objetos grandes de equipo como resultado final:
     durante la prueba vimos que pueden contener marcadores de otros encuentros.
   */
   if(ssSport==='football'&&!cand.some(x=>ssValidate(x.diag,ev,targetDate))){
     for(const t of [...new Set([...A,...B])].slice(0,3)){
       const r=await ssGet(`https://sportscore.com/api/widget/team/?sport=${ssSport}&slug=${encodeURIComponent(t)}&limit=20&src=${SPORT_SCORE_SRC}`);
       if(r.ok&&ssHasTeams(r.data,ev.home,ev.away)){
         const d=ssSelect(r.data,ev,targetDate);
         if(d)cand.push({diag:d,kind:'team'});
       }
     }
   }
   cand.sort((a,b)=>b.diag.rank-a.diag.rank);
   /*
     En baloncesto exigimos que la coincidencia validada proceda del endpoint
     específico del partido. En fútbol mantenemos la lógica anterior.
   */
   const best=cand.find(x=>ssValidate(x.diag,ev,targetDate)&&(ssSport!=='basketball'||x.kind==='match'));
   if(!best)return null;
   const d=best.diag,sc=d.score;
   let h=sc.home,a=sc.away;
   if(d.orientation==='swapped')[h,a]=[a,h];
   return {
     source:'SportScore',
     sport:mapped,
     event_id:`ss-${ssSport}-${normalize(ev.home)}-${normalize(ev.away)}-${targetDate}`,
     event_date:d.bestTemporal.iso,
     status:'FINISHED',
     home:ev.home,
     away:ev.away,
     score_home:h,
     score_away:a,
     finished:true,
     competition:ev.title||''
   };
 }
 function ssAlreadyElapsed(ev,targetDate){
   const now=new Date(),today=ssMadridYmd(now);
   if(targetDate<today)return true;
   if(targetDate>today)return false;
   const nowHm=ssMadridHm(now),n=ssMins(nowHm),e=ssMins(ev.time);
   if(n==null||e==null)return false;
   /*
     V57:
     fútbol: empieza a buscar resultado a los 95 min.
     baloncesto: a los 125 min para evitar consultas mientras el partido
     probablemente sigue en juego. Si acaba antes, aparecerá en la siguiente
     actualización de 10 min.
   */
   const wait=sportMap(ev.sport)==='Basketball'?125:95;
   return n>=e+wait;
 }
 async function sportScoreFallback(missing,targetDate){
   const candidates=missing.filter(e=>{
     const s=sportMap(e.sport);
     return (s==='Football'||s==='Basketball')&&e.type==='match'&&e.home&&e.away&&ssAlreadyElapsed(e,targetDate);
   });
   if(!candidates.length)return [];
   const recentBySport={};
   /*
     "matches" sigue siendo útil como atajo para fútbol.
     En baloncesto se consulta también, pero el resultado definitivo solo
     se acepta desde /match/ específico dentro de ssProbe.
   */
   for(const s of [...new Set(candidates.map(e=>sportMap(e.sport)))]){
     const ssSport=s==='Basketball'?'basketball':'football';
     try{
       const r=await ssGet(`https://sportscore.com/api/widget/matches/?sport=${ssSport}&limit=50&src=${SPORT_SCORE_SRC}`);
       if(r.ok)recentBySport[s]=r.data;
     }catch{}
   }
   const out=[];
   for(const ev of candidates){
     try{
       const x=await ssProbe(ev,targetDate,recentBySport[sportMap(ev.sport)]||null);
       if(x)out.push(x);
     }catch{}
   }
   return out;
 }
 async function load(force=false){
   $('#dateText').textContent=formatDate();
   if(!matches.length)setLiveStatus('Cargando resultados','comprobando novedades…',true);else setLiveStatus('Eventos mostrados','comprobando novedades…',true);

   try{
     const published=await loadPublished();
     offered=(published.events||[]).map(cleanOfferedEvent);
     $('#countDay').textContent=offered.length;
     const targetDate=published.date||localDate();

     const offeredSports=[...new Set(offered.map(o=>sportMap(o.sport)).filter(s=>SUPPORTED.has(s)))];
     const hasFootball=offeredSports.includes('Football');
     const hasTennis=tennisMatchesForGate(offered).length>0;

     const earlySports=[...new Set(
       offered
         .filter(o=>o.type==='match'&&isEarlyTime(o.time))
         .map(o=>sportMap(o.sport))
         .filter(s=>s==='Football')
     )];

     /*
       V58 · PRIMERA CARGA RÁPIDA
       Fútbol, caché de tenis y madrugada se leen EN PARALELO.
       Antes se hacían en varios pasos y el usuario podía ver
       "cargando" durante demasiado tiempo.
     */
     const jobs=[];

     if(hasFootball){
       jobs.push(
         fetchResults(targetDate,['Football'],force)
           .then(events=>({kind:'main-football',events}))
           .catch(()=>({kind:'main-football',events:[]}))
       );
     }

     if(hasTennis){
       jobs.push(
         fetchResults(targetDate,['Tennis'],false,{tennisCacheOnly:true})
           .then(events=>({kind:'tennis-cache',events}))
           .catch(()=>({kind:'tennis-cache',events:[]}))
       );
     }

     if(earlySports.length){
       jobs.push(
         fetchResults(localDate(-1),earlySports,force)
           .then(events=>({kind:'early-football',events}))
           .catch(()=>({kind:'early-football',events:[]}))
       );
     }

     const firstBatch=await Promise.all(jobs);
     let apiEvents=dedupeEvents(firstBatch.flatMap(x=>x.events||[]));

     /*
       Render inmediato con lo que ya existe en caché/API.
       SportScore y posibles refrescos de tenis llegan después,
       sin bloquear la pantalla.
     */
     let result=matchEvents(offered,apiEvents);
     const beforeFirstUpdate=currentResultKeys();
     matches=result.found;
     detectNewResults(beforeFirstUpdate);
     render();
     saveFastCache(targetDate);
     setLiveStatus('Eventos mostrados','comprobando novedades…',true);$('#updatedText').textContent='';

     /*
       V58 · REFRESCO DE TENIS EN SEGUNDO PLANO
       Solo si la ventana de alguno de los partidos lo requiere.
     */
     if(hasTennis){
       const decision=tennisRefreshDecision(offered,result.found,targetDate);

       if(decision.shouldRefresh){
         try{
           const refreshedTennis=await fetchResults(
             targetDate,
             ['Tennis'],
             false,
             {tennisDone:false}
           );

           apiEvents=apiEvents.filter(e=>sportMap(e?.sport)!=='Tennis');
           apiEvents.push(...refreshedTennis);
           apiEvents=dedupeEvents(apiEvents);

           const beforeTennisUpdate=currentResultKeys();
           result=matchEvents(offered,apiEvents);
           matches=result.found;
           detectNewResults(beforeTennisUpdate);
           render();
           saveFastCache(targetDate);
         }catch{}
       }
     }

     /*
       V58 · SPORTScore AL FINAL
       Los fallbacks de fútbol/baloncesto pueden necesitar varias consultas.
       Ya no mantienen bloqueada la página: el cliente ve primero todos los
       resultados rápidos y, si SportScore encuentra alguno, aparece después.
     */
     try{
       const ssEvents=await sportScoreFallback(result.missing,targetDate);

       if(ssEvents.length){
         apiEvents=dedupeEvents([...apiEvents,...ssEvents]);
         const beforeSportScoreUpdate=currentResultKeys();
         result=matchEvents(offered,apiEvents);
         matches=result.found;
         detectNewResults(beforeSportScoreUpdate);
         render();
         saveFastCache(targetDate);
       }
     }catch{}

     /*
       Congelar tenis cuando todos los partidos publicados están resueltos.
       No consulta TheRundown.
     */
     const tennisJustCompleted=markTennisDone(
       offered,
       result.found,
       targetDate
     );

     const tennisDecisionAfter=tennisRefreshDecision(
       offered,
       result.found,
       targetDate
     );

     if(hasTennis&&(tennisJustCompleted||tennisDecisionAfter.allResolved)){
       fetchResults(
         targetDate,
         ['Tennis'],
         false,
         {tennisDone:true,tennisCacheOnly:true}
       ).catch(()=>{});
     }

     matches=result.found;
     render();
     saveFastCache(targetDate);

     setLiveStatus('Resultados actualizados','sin novedades pendientes',false);$('#updatedText').textContent=
       'Actualizado '+new Date().toLocaleTimeString(
         'es-ES',
         {hour:'2-digit',minute:'2-digit'}
       );
   }catch(err){
     /*
       Si ya restauramos resultados guardados, no los borramos porque falle
       una actualización puntual de red.
     */
     if(matches.length){
       setLiveStatus('Eventos mostrados','última comprobación incompleta',false);$('#updatedText').textContent='Se volverá a intentar automáticamente';
       render();
     }else{
       matches=[];
       $('#countFinal').textContent='0';const heroCount=$('#heroResultCount');if(heroCount)heroCount.textContent='0';
       $('#countDay').textContent=offered.length||'—';
       setLiveStatus('Eventos mostrados','no se pudo completar la comprobación',false);$('#updatedText').textContent='Se volverá a intentar automáticamente';
       $('#content').innerHTML=`<div class="error">${esc(err?.message||'No se pudieron consultar los resultados.')}</div>`;
     }
   }
 }
 /*
   V60 · NAVEGACIÓN TV BOX COMO CARTELERA

   Las tarjetas de resultados dejan de ser elementos enfocables.
   No hay foco verde, no hay "SELECCIONADO" y no ejecutamos cálculos
   de rejilla en cada pulsación.

   Las flechas quedan libres para que el navegador/TV Box haga su
   desplazamiento nativo, igual que en cartelera.html. Es bastante
   más ligero en dispositivos Android TV modestos.
 */
 document.addEventListener('keydown',e=>{
   const key=e.key;
   if(key==='Escape'||key==='BrowserBack'||key==='GoBack'){
     e.preventDefault();
     location.href='cliente.html';
   }
 });

 document.addEventListener('copy',e=>e.preventDefault());
 document.addEventListener('cut',e=>e.preventDefault());
 document.addEventListener('dragstart',e=>e.preventDefault());

 /*
   Carga instantánea:
   si este dispositivo ya entró hoy, pinta la última vista guardada
   ANTES de consultar Internet. Después actualiza silenciosamente.
 */
 restoreFastCache();
 load(false);

 setInterval(()=>load(false),600000);
})()
</script>
