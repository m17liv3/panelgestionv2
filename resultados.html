em;font-weight:950;letter-spacing:.08em;box-shadow:0 0 18px rgba(119,255,88,.35)}.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.competition{color:#7f9ab0;font-size:.76rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:72%}.status{font-size:.69rem;font-weight:950;text-transform:uppercase;letter-spacing:.06em;border-radius:999px;padding:5px 8px;color:#caffbb;background:rgba(119,255,88,.09);border:1px solid rgba(119,255,88,.18)}.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px 16px;align-items:center}.teamWrap{display:flex;align-items:center;gap:9px;min-width:0}.teamLogo{width:26px;height:26px;object-fit:contain;flex:0 0 auto}.team{font-weight:900;font-size:clamp(.96rem,2vw,1.12rem);overflow-wrap:anywhere}.score{font-size:1.38rem;font-weight:950;min-width:36px;text-align:right;color:#fff}.loading,.empty,.error{text-align:center;padding:50px 18px;border:1px dashed rgba(130,190,230,.22);border-radius:20px;color:var(--muted);background:rgba(13,23,39,.55)}.error{color:#ff9cab;border-color:rgba(255,93,116,.28)}.foot{text-align:center;color:#5f788e;font-size:.73rem;margin-top:26px;line-height:1.55}.source{color:#7894a9}.updated{color:#7790a5;font-size:.77rem;text-align:center;margin:9px 0 0}

<script>
(function(){
 const API_PROXY='https://qjbnjhojwhcndcfjcyrc.supabase.co/functions/v1/resultados-dia';
 const cfg=window.M17_CONFIG||{};
 const BIN_ID=cfg.cartBinId||'';
 const BIN_KEY=cfg.cartKey||'';
 // Fuentes automáticas activas en V51. Fútbol usa football-data.org y respaldo SportScore con validación estricta. El resto se omite para evitar resultados incorrectos.
 const SUPPORTED=new Set(['Football','Tennis']);
 const ICONS={Football:'⚽',Tennis:'🎾',Basketball:'🏀',Baseball:'⚾',Hockey:'🏒',Handball:'🤾',Volleyball:'🏐',NFL:'🏈',Rugby:'🏉',Padel:'🎾',Cycling:'🚴',Golf:'⛳',Motorsport:'🏍️',Swimming:'🏊',Unknown:'•'};
 let matches=[],offered=[];
 const $=s=>document.querySelector(s);
 const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
 function localDate(offsetDays=0){const d=new Date();d.setDate(d.getDate()+offsetDays);const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
 function isEarlyTime(t){const m=String(t||'').match(/^(\d{1,2}):(\d{2})$/);if(!m)return false;const mins=Number(m[1])*60+Number(m[2]);return mins<180}
 function formatDate(){return new Intl.DateTimeFormat('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date()).replace(/^./,c=>c.toUpperCase())}
 function normalize(v){return String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\b(fc|cf|afc|sc|ac|cd|ud|ue|sd|rc|club|deportivo|deportes|futbol|football|soccer|women|woman|femenino|femenina|team)\b/g,' ').replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim()}
 function toks(v){return normalize(v).split(' ').filter(x=>x.length>1)}
 function sim(a,b){a=normalize(a);b=normalize(b);if(!a||!b)return 0;if(a===b)return 1;if(a.includes(b)||b.includes(a))return .92;const A=toks(a),B=toks(b);if(!A.length||!B.length)return 0;let hit=0;for(const x of A){if(B.some(y=>x===y||(x.length>=4&&y.length>=4&&(x.startsWith(y)||y.startsWith(x)))))hit++}return hit/Math.max(A.length,B.length)}
 function sportMap(s){const t=String(s||'').toLowerCase();if(/padel|pádel/.test(t))return 'Padel';if(/tenis|tennis|atp|wta/.test(t))return 'Tennis';if(/cicl|cycling/.test(t))return 'Cycling';if(/golf/.test(t))return 'Golf';if(/moto|motogp|motocicl|formula|f1/.test(t))return 'Motorsport';if(/nataci|swim/.test(t))return 'Swimming';if(/basket/.test(t))return 'Basketball';if(/base|beisbol|béisbol/.test(t))return 'Baseball';if(/hockey/.test(t))return 'Hockey';if(/hand|balonmano/.test(t))return 'Handball';if(/volley|voleibol/.test(t))return 'Volleyball';if(/nfl|futbol americano|fútbol americano/.test(t))return 'NFL';if(/rugby/.test(t))return 'Rugby';if(/foot|soccer|futbol|fútbol/.test(t))return 'Football';return 'Unknown'}
 function cleanParticipant(v){let s=String(v||'').replace(/\s+(?:📺|🗂)\s*(?:CANAL|CARPETA)?\s*:?.*$/i,'').replace(/\s+[|·]\s+.*$/,'').trim();const flags=[...s.matchAll(/[\u{1F1E6}-\u{1F1FF}]{2}\s*/gu)];if(flags.length){const m=flags[flags.length-1];s=s.slice((m.index||0)+m[0].length).trim()}return s.replace(/^[^\p{L}\p{N}]+/u,'').trim()}
 function cleanOfferedEvent(o){if(!o||typeof o!=='object')return o;const x={...o};x.home=cleanParticipant(x.home);x.away=cleanParticipant(x.away);/* Compatibilidad con datos ya publicados por versiones anteriores: si el segundo participante quedó contaminado con CANAL/CARPETA, se limpia aquí sin exigir volver a publicar. */if((!x.home||!x.away)&&x.sourceLine){const t=parseText(x.sourceLine);if(t[0]&&t[0].type==='match'){x.home=cleanParticipant(t[0].home);x.away=cleanParticipant(t[0].away)}}return x}
 function parseText(text){let current='Unknown',out=[];for(const raw of String(text||'').split(/\r?\n/)){let line=raw.replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim();if(!line)continue;if(!/^⏰/.test(line)&&!/^\d{1,2}[:.]\d{2}/.test(line)){const h=sportMap(line);if(h!=='Unknown'&&!/^📺|^🗂/.test(line)&&line.length<90)current=h;continue}const tm=(line.match(/(?:^|⏰\s*)([0-2]?\d[:.][0-5]\d)/)||[])[1]||'';let title=line.replace(/^\s*⏰\s*[0-2]?\d[:.][0-5]\d\s*[-–—|·:]?\s*/,'').replace(/^\s*[0-2]?\d[:.][0-5]\d\s*[-–—|·:]?\s*/,'').trim();if(!title)continue;let home='',away='',type='event';const sep=title.match(/\s*(?:🆚|\bvs\.?\b|\bv\.?\b|\bcontra\b)\s*/i);if(sep){let left=title.slice(0,sep.index).trim(),right=title.slice(sep.index+sep[0].length).trim();if(left.includes(':'))left=left.split(':').pop().trim();home=cleanParticipant(left);away=cleanParticipant(right);if(home&&away)type='match'}out.push({sport:current,type,title,home,away,time:tm.replace('.',':'),sourceLine:line})}return out}
 async function loadPublished(){if(!BIN_ID||!BIN_KEY)return {events:[],text:'',date:''};const r=await fetch(`https://api.jsonbin.io/v3/b/${encodeURIComponent(BIN_ID)}/latest?_=${Date.now()}`,{cache:'no-store',headers:{'X-Master-Key':BIN_KEY,'X-Access-Key':BIN_KEY}});if(!r.ok)throw new Error('No se pudo leer la programación publicada');const j=await r.json(),rec=j.record||{};
   /* V42: resultados usa un snapshot propio creado al pulsar Guardar y publicar.
      Esto desacopla los resultados de otros campos de Cartelera que pueden cambiar
      después por generación de imágenes, previews u otras herramientas. */
   const snapDate=rec.resultados_fecha||rec.eventos_fecha||'';
   const snapText=(typeof rec.resultados_texto==='string')?rec.resultados_texto:(rec.texto||'');
   const snapStored=Array.isArray(rec.resultados_eventos)?rec.resultados_eventos:(Array.isArray(rec.eventos_datos)?rec.eventos_datos:[]);
   if(snapDate&&snapDate!==localDate())return {events:[],date:snapDate,text:snapText};
   const parsedFromText=parseText(snapText);
   const list=snapStored.length?snapStored:parsedFromText;
   return {events:list,date:snapDate,text:snapText}}
 function apiId(e){return String(e?.event_id??e?.id??'')}
 function apiSides(e){const sport=sportMap(e?.sport);if(sport==='Tennis')return {a:e.away||'',b:e.home||'',aScore:e.score_away,bScore:e.score_home};return {a:e.home||'',b:e.away||'',aScore:e.score_home,bScore:e.score_away}}
 function matchOne(o,list,used){if(!o||o.type!=='match'||!o.home||!o.away)return null;const os=sportMap(o.sport);let best=null,bs=0;for(const e of list){const id=apiId(e);if(!id||used.has(id))continue;const es=sportMap(e.sport);if(os!=='Unknown'&&es!=='Unknown'&&os!==es)continue;const x=apiSides(e);const direct=(sim(o.home,x.a)+sim(o.away,x.b))/2;const swapped=(sim(o.home,x.b)+sim(o.away,x.a))/2;const score=Math.max(direct,swapped);if(score>bs){bs=score;best={api:e,score,swapped:swapped>direct,sides:x}}}return bs>=.62?best:null}
 function matchEvents(offeredList,apiList){const used=new Set(),found=[],missing=[];for(const o of offeredList){if(o.type!=='match'||!SUPPORTED.has(sportMap(o.sport)))continue;const m=matchOne(o,apiList,used);if(m){used.add(apiId(m.api));found.push({offered:o,...m})}else missing.push(o)}return {found,missing}}
 function setsText(x){const e=x.api;if(sportMap(e.sport)!=='Tennis')return '';let a=Array.isArray(e.sets_away)?[...e.sets_away]:[],h=Array.isArray(e.sets_home)?[...e.sets_home]:[];/* TheRundown: away/home. Determine published order directly. */const pubA=x.offered.home,pubB=x.offered.away;const awayFirst=(sim(pubA,e.away)>=sim(pubA,e.home));if(!awayFirst)[a,h]=[h,a];return a.map((v,i)=>`${v}-${h[i]??'—'}`).join(' · ')}
 function displayScores(x){const e=x.api,o=x.offered,s=sportMap(e.sport);if(s==='Tennis'){const firstIsAway=sim(o.home,e.away)>=sim(o.home,e.home);return firstIsAway?[e.score_away,e.score_home]:[e.score_home,e.score_away]}const firstIsHome=sim(o.home,e.home)>=sim(o.home,e.away);return firstIsHome?[e.score_home,e.score_away]:[e.score_away,e.score_home]}
 function competitionText(e){if(sportMap(e.sport)==='Tennis')return [e.league,e.tournament,e.round].filter(Boolean).join(' · ');return [e.competition,e.competition_code].filter(Boolean).join(' · ')}
 function eventHtml(x){const e=x.api,o=x.offered,[s1,s2]=displayScores(x),isTennis=sportMap(e.sport)==='Tennis',sets=isTennis?setsText(x):'';const retired=e.status==='STATUS_RETIRED';return `<article class="event" tabindex="0"><div class="meta"><span class="competition">${esc(competitionText(e))}</span><span class="status">${retired?'Retirado':'Finalizado'}</span></div><div class="row"><div class="teamWrap"><div class="team">${esc(o.home)}</div></div><div class="score">${esc(s1??'—')}</div><div class="teamWrap"><div class="team">${esc(o.away)}</div></div><div class="score">${esc(s2??'—')}</div></div>${sets?`<div style="margin-top:10px;color:#9bb1c5;font-size:.82rem">Sets: <b style="color:#dff8ff">${esc(sets)}</b></div>`:''}</article>`}
 function render(){$('#countFinal').textContent=matches.length;if(!matches.length){$('#content').innerHTML='<div class="empty"><b style="color:#dff8ff">Todavía no hay resultados finalizados disponibles.</b><br><span style="display:inline-block;margin-top:8px">Vuelve a consultar en unos minutos.</span></div>';return}const sports={};for(const x of matches){const s=sportMap(x.api.sport);(sports[s]||(sports[s]=[])).push(x)}$('#content').innerHTML=Object.entries(sports).map(([sport,arr])=>{const label=sport==='Football'?'Fútbol':sport==='Tennis'?'Tenis':sport;return `<section class="sportSection"><div class="sportHeader"><span class="sportIcon">${ICONS[sport]||'•'}</span><h2>${esc(label)}</h2><small>${arr.length} ${arr.length===1?'resultado':'resultados'}</small></div><div class="events">${arr.map(eventHtml).join('')}</div></section>`}).join('')}
 async function fetchResults(date,sports,force=false){
   if(!sports.length)return [];
   const forcePart=force?'&force=1':'';
   const apiResponse=await fetch(`${API_PROXY}?date=${date}&sports=${encodeURIComponent(sports.join(','))}${forcePart}`,{cache:'no-store'});
   const j=await apiResponse.json();
   if(!apiResponse.ok||j.error)throw new Error(j.error||`Respuesta ${apiResponse.status}`);
   return Array.isArray(j.events)?j.events:[];
 }
 function dedupeEvents(list){const seen=new Set(),out=[];for(const e of list){const id=apiId(e)||`${e?.sport||''}|${e?.event_date||''}|${e?.home||''}|${e?.away||''}`;if(seen.has(id))continue;seen.add(id);out.push(e)}return out}

 /* V51 · respaldo estricto de fútbol con SportScore.
    Solo se acepta un resultado cuando coinciden equipos, fecha local, hora y estado finalizado. */
 const SPORT_SCORE_SRC='m17liv3-client-v51';
 function ssNorm(v){return String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\b(fc|cf|afc|sc|ac|cd|ud|ue|sd|rc|club|deportivo|deportes|futbol|football|soccer|women|femenino|femenina)\b/g,' ').replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim()}
 function ssSlug(v,drop=false){let s=ssNorm(v);if(drop)s=s.replace(/\b(de|del|la|el|los|las)\b/g,' ').replace(/\s+/g,' ').trim();return s.replace(/\s+/g,'-')}
 function ssTokens(v){return ssNorm(v).split(' ').filter(x=>x.length>=3)}
 function ssHasTeams(data,a,b){let s='';try{s=ssNorm(JSON.stringify(data||{}))}catch{}const A=ssTokens(a),B=ssTokens(b);return A.some(x=>s.includes(x))&&B.some(x=>s.includes(x))}
 async function ssGet(url){const r=await fetch(url,{cache:'no-store'});let data={};try{data=await r.json()}catch{}return {ok:r.ok,status:r.status,data,url}}
 function ssFindScore(obj){let best=null;function walk(x,d=0){if(!x||d>8||best)return;if(Array.isArray(x)){for(const y of x)walk(y,d+1);return}if(typeof x!=='object')return;const pairs=[['home_score','away_score'],['score_home','score_away'],['homeScore','awayScore'],['home_score_display','away_score_display']];for(const [hk,ak] of pairs){if(hk in x&&ak in x){const h=x[hk],a=x[ak];if((typeof h==='number'||/^\d+$/.test(String(h)))&&(typeof a==='number'||/^\d+$/.test(String(a)))){best={home:Number(h),away:Number(a)};return}}}if(typeof x.score==='string'&&/^\s*\d+\s*[-:]\s*\d+\s*$/.test(x.score)){const m=x.score.match(/(\d+)\s*[-:]\s*(\d+)/);best={home:Number(m[1]),away:Number(m[2])};return}for(const k of Object.keys(x))walk(x[k],d+1)}walk(obj);return best}
 function ssFindStatus(obj){let out='';function walk(x,d=0){if(!x||d>7||out)return;if(Array.isArray(x)){for(const y of x)walk(y,d+1);return}if(typeof x!=='object')return;for(const k of Object.keys(x)){if(/^(status|state|match_status|status_text|event_status)$/i.test(k)&&typeof x[k]==='string'){out=x[k];return}}for(const k of Object.keys(x))walk(x[k],d+1)}walk(obj);return out}
 function ssFinished(v){return /finished|final|ended|complete|completed|\bft\b|after extra time|aet|penalties/i.test(String(v||''))}
 function ssMadridYmd(d){try{return new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Madrid',year:'numeric',month:'2-digit',day:'2-digit'}).format(d)}catch{return ''}}
 function ssMadridHm(d){try{return new Intl.DateTimeFormat('es-ES',{timeZone:'Europe/Madrid',hour:'2-digit',minute:'2-digit',hour12:false}).format(d)}catch{return ''}}
 function ssParseDate(v){if(v==null)return null;if(typeof v==='number'){if(v<1e9)return null;let n=v;if(n<1e12)n*=1000;const d=new Date(n);return isNaN(+d)?null:d}const t=String(v).trim();if(!t)return null;if(/^\d{10,13}$/.test(t)){let n=Number(t);if(n<1e12)n*=1000;const d=new Date(n);return isNaN(+d)?null:d}if(!(/\d{4}[-/]\d{1,2}[-/]\d{1,2}/.test(t)||/\d{1,2}[-/]\d{1,2}[-/]\d{4}/.test(t)||/T\d{2}:\d{2}/.test(t)))return null;const d=new Date(t);return isNaN(+d)?null:d}
 function ssTemporal(root){const out=[],seen=new Set(),rx=/(date|time|timestamp|start|kick|sched|utc|begin|commence|matchday|day)/i;function walk(x,path='root',d=0){if(x==null||d>9)return;if(Array.isArray(x)){x.forEach((y,i)=>walk(y,`${path}[${i}]`,d+1));return}if(typeof x!=='object')return;for(const [k,v] of Object.entries(x)){if(v==null)continue;const p=`${path}.${k}`,primitive=typeof v==='string'||typeof v==='number';if(primitive&&(rx.test(k)||ssParseDate(v))){const dt=ssParseDate(v),sig=p+'|'+String(v);if(dt&&!seen.has(sig)){seen.add(sig);out.push({path:p,key:k,raw:v,date:ssMadridYmd(dt),time:ssMadridHm(dt),iso:dt.toISOString()})}}if(typeof v==='object')walk(v,p,d+1)}}walk(root);return out}
 function ssMins(t){const m=String(t||'').match(/^(\d{1,2}):(\d{2})$/);return m?Number(m[1])*60+Number(m[2]):null}
 function ssDiff(a,b){const A=ssMins(a),B=ssMins(b);if(A==null||B==null)return null;const d=Math.abs(A-B);return Math.min(d,1440-d)}
 function ssTeamObjects(root,a,b){const out=[],seen=new Set();function walk(x,d=0){if(!x||d>8)return;if(Array.isArray(x)){for(const y of x)walk(y,d+1);return}if(typeof x!=='object')return;let s='';try{s=JSON.stringify(x)}catch{}if(s&&s.length<160000&&ssHasTeams(x,a,b)){const key=s.slice(0,2000);if(!seen.has(key)){seen.add(key);out.push({obj:x,size:s.length})}}for(const k of Object.keys(x))walk(x[k],d+1)}walk(root);return out.sort((a,b)=>a.size-b.size).slice(0,30)}
 function ssName(v){if(typeof v==='string')return v;if(v&&typeof v==='object'){for(const k of ['name','team_name','short_name','title','slug'])if(typeof v[k]==='string')return v[k]}return ''}
 function ssFindSides(obj){let found=null;const pairs=[['home_team','away_team'],['homeTeam','awayTeam'],['team_home','team_away'],['home_name','away_name'],['homeName','awayName']];function walk(x,d=0){if(!x||d>7||found)return;if(Array.isArray(x)){for(const y of x)walk(y,d+1);return}if(typeof x!=='object')return;for(const [h,a] of pairs){if(h in x&&a in x){const hn=ssName(x[h]),an=ssName(x[a]);if(hn&&an){found={home:hn,away:an};return}}}for(const k of Object.keys(x))walk(x[k],d+1)}walk(obj);return found}
 function ssAnalyze(obj,ev,targetDate){const status=ssFindStatus(obj),score=ssFindScore(obj),sides=ssFindSides(obj),temps=ssTemporal(obj);const ranked=temps.map(t=>{const same=t.date===targetDate,diff=ssDiff(t.time,ev.time);let rank=(same?400:0)+(diff!=null?Math.max(0,180-diff):0)+100;if(/start|kick|sched|date|time/i.test(t.key))rank+=60;return {...t,same,diff,rank}}).sort((a,b)=>b.rank-a.rank);const bt=ranked[0]||null;let orientation='unknown';if(sides){const direct=(sim(ev.home,sides.home)+sim(ev.away,sides.away))/2,swap=(sim(ev.home,sides.away)+sim(ev.away,sides.home))/2;orientation=direct>=swap?'direct':'swapped'}return {status,score,sides,orientation,bestTemporal:bt,rank:(score?100:0)+(ssFinished(status)?120:0)+(bt?.same?350:0)+(bt?.diff!=null?Math.max(0,120-bt.diff):0)}}
 function ssSelect(data,ev,targetDate){let best=null;for(const c of ssTeamObjects(data,ev.home,ev.away)){const a=ssAnalyze(c.obj,ev,targetDate);if(!best||a.rank>best.rank)best={...a,obj:c.obj}}return best}
 function ssVariants(team){const set=new Set([ssSlug(team,false),ssSlug(team,true)]);const n=ssNorm(team);if(n.includes('atletico madrid'))set.add('atletico-madrid');if(n.includes('manchester city'))set.add('manchester-city');return [...set].filter(Boolean)}
 function ssValidate(diag,ev,targetDate){if(!diag||!diag.score||!ssFinished(diag.status)||!diag.bestTemporal)return false;if(diag.bestTemporal.date!==targetDate)return false;if(diag.bestTemporal.diff==null||diag.bestTemporal.diff>30)return false;return true}
 async function ssProbe(ev,targetDate,recent){const cand=[];if(recent&&ssHasTeams(recent,ev.home,ev.away)){const d=ssSelect(recent,ev,targetDate);if(d)cand.push({diag:d,kind:'recent'})}const A=ssVariants(ev.home),B=ssVariants(ev.away),slugs=[];for(const a of A)for(const b of B)slugs.push(`${a}-vs-${b}`,`${b}-vs-${a}`);for(const slug of [...new Set(slugs)].slice(0,6)){const r=await ssGet(`https://sportscore.com/api/widget/match/?sport=football&slug=${encodeURIComponent(slug)}&src=${SPORT_SCORE_SRC}`);if(r.ok&&ssHasTeams(r.data,ev.home,ev.away)){const d=ssSelect(r.data,ev,targetDate);if(d)cand.push({diag:d,kind:'match'})}}if(!cand.some(x=>ssValidate(x.diag,ev,targetDate))){for(const t of [...new Set([...A,...B])].slice(0,3)){const r=await ssGet(`https://sportscore.com/api/widget/team/?sport=football&slug=${encodeURIComponent(t)}&limit=20&src=${SPORT_SCORE_SRC}`);if(r.ok&&ssHasTeams(r.data,ev.home,ev.away)){const d=ssSelect(r.data,ev,targetDate);if(d)cand.push({diag:d,kind:'team'})}}}cand.sort((a,b)=>b.diag.rank-a.diag.rank);const best=cand.find(x=>ssValidate(x.diag,ev,targetDate));if(!best)return null;const d=best.diag,sc=d.score;let h=sc.home,a=sc.away;if(d.orientation==='swapped')[h,a]=[a,h];return {source:'SportScore',sport:'Football',event_id:`ss-${normalize(ev.home)}-${normalize(ev.away)}-${targetDate}`,event_date:d.bestTemporal.iso,status:'FINISHED',home:ev.home,away:ev.away,score_home:h,score_away:a,finished:true,competition:ev.title||''}}
 function ssAlreadyElapsed(ev,targetDate){const now=new Date(),today=ssMadridYmd(now);if(targetDate<today)return true;if(targetDate>today)return false;const nowHm=ssMadridHm(now),n=ssMins(nowHm),e=ssMins(ev.time);return n!=null&&e!=null&&n>=e+95}
 async function sportScoreFallback(missing,targetDate){const candidates=missing.filter(e=>sportMap(e.sport)==='Football'&&e.type==='match'&&e.home&&e.away&&ssAlreadyElapsed(e,targetDate));if(!candidates.length)return [];let recent=null;try{const r=await ssGet(`https://sportscore.com/api/widget/matches/?sport=football&limit=50&src=${SPORT_SCORE_SRC}`);if(r.ok)recent=r.data}catch{}const out=[];for(const ev of candidates){try{const x=await ssProbe(ev,targetDate,recent);if(x)out.push(x)}catch{}}return out}
 async function load(force=false){
   $('#dateText').textContent=formatDate();$('#updatedText').textContent='Actualizando…';$('#refreshBtn').disabled=true;
   try{
     const published=await loadPublished();offered=(published.events||[]).map(cleanOfferedEvent);$('#countDay').textContent=offered.length;
     const targetDate=published.date||localDate();
     const requested=[...new Set(offered.map(o=>sportMap(o.sport)).filter(s=>SUPPORTED.has(s)))];
     const earlySports=[...new Set(offered.filter(o=>o.type==='match'&&isEarlyTime(o.time)).map(o=>sportMap(o.sport)).filter(s=>SUPPORTED.has(s)))];
     let apiEvents=[];
     if(requested.length) apiEvents.push(...await fetchResults(targetDate,requested,force));
     if(earlySports.length){await new Promise(resolve=>setTimeout(resolve,1600));apiEvents.push(...await fetchResults(localDate(-1),earlySports,force))}
     apiEvents=dedupeEvents(apiEvents);
     let result=matchEvents(offered,apiEvents);
     /* V51: si football-data.org no cubre un partido, se intenta SportScore.
        Solo se incorporan resultados con fecha/hora exactas y estado finalizado. */
     const ssEvents=await sportScoreFallback(result.missing,targetDate);
     if(ssEvents.length){apiEvents=dedupeEvents([...apiEvents,...ssEvents]);result=matchEvents(offered,apiEvents)}
     matches=result.found;
     $('#updatedText').textContent='Actualizado '+new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});render();
   }catch(err){matches=[];$('#countFinal').textContent='0';$('#countDay').textContent=offered.length||'—';$('#updatedText').textContent='No se pudo actualizar';$('#content').innerHTML=`<div class="error">${esc(err?.message||'No se pudieron consultar los resultados.')}</div>`}
   finally{$('#refreshBtn').disabled=false}
 }
 function cards(){return Array.from(document.querySelectorAll('.event'))}
 $('#refreshBtn').addEventListener('click',()=>load(true));
 document.addEventListener('keydown',e=>{const key=e.key,cs=cards(),el=document.activeElement;if(key==='Escape'||key==='BrowserBack'||key==='GoBack'){e.preventDefault();location.href='cliente.html';return}if(el===$('#backBtn')&&key==='ArrowRight'){e.preventDefault();$('#refreshBtn').focus();return}if(el===$('#refreshBtn')&&key==='ArrowLeft'){e.preventDefault();$('#backBtn').focus();return}if((el===$('#backBtn')||el===$('#refreshBtn'))&&key==='ArrowDown'&&cs.length){e.preventDefault();cs[0].focus();return}if(cs.includes(el)){let i=cs.indexOf(el),cols=window.innerWidth>700?2:1;if(key==='ArrowDown'){e.preventDefault();cs[Math.min(cs.length-1,i+cols)].focus();return}if(key==='ArrowUp'){e.preventDefault();const ni=i-cols;if(ni<0)$('#backBtn').focus();else cs[ni].focus();return}if(key==='ArrowLeft'||key==='ArrowRight'){e.preventDefault();cs[Math.max(0,Math.min(cs.length-1,i+(key==='ArrowRight'?1:-1)))].focus();return}}});
 document.addEventListener('copy',e=>e.preventDefault());document.addEventListener('cut',e=>e.preventDefault());document.addEventListener('dragstart',e=>e.preventDefault());
 load(false);setTimeout(()=>{try{$('#backBtn').focus({preventScroll:true})}catch(_){$('#backBtn').focus()}},150);setInterval(()=>load(false),600000);
})()
