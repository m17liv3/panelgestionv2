<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050812">
<title>M17LIV3 · Resultados del día</title>
<style>
:root{--bg:#050812;--panel:#0c1422;--text:#f5fbff;--muted:#8aa1b8;--cyan:#00e5ff;--green:#78ff55;--orange:#ffb648;--red:#ff5b6f;--border:rgba(130,190,230,.16)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -10%,rgba(0,229,255,.13),transparent 30%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;user-select:none;-webkit-user-select:none}body{padding:22px max(18px,env(safe-area-inset-right)) max(32px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));overflow-x:hidden}.wrap{width:min(1100px,100%);margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}.back{display:inline-flex;align-items:center;gap:8px;color:var(--cyan);text-decoration:none;border:1px solid rgba(0,229,255,.24);background:rgba(0,229,255,.08);padding:11px 14px;border-radius:13px;font-weight:900;outline:none}.back:focus{box-shadow:0 0 0 3px rgba(0,229,255,.18);border-color:var(--cyan)}.stamp{color:var(--muted);font-size:.82rem}.hero{text-align:center;margin:4px 0 22px}.hero small{text-transform:uppercase;letter-spacing:.2em;color:var(--green);font-weight:900}.hero h1{margin:8px 0 7px;font-size:clamp(2rem,5vw,4rem);letter-spacing:-.05em;line-height:1}.hero p{margin:0;color:var(--muted);font-size:clamp(.88rem,1.8vw,1.05rem)}.filters{display:flex;gap:9px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filter{flex:0 0 auto;border:1px solid var(--border);background:#0d1727;color:#a8bacb;border-radius:999px;padding:10px 15px;font-weight:850;outline:none}.filter.active,.filter:focus{color:#031015;background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,229,255,.15)}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 18px}.stat{background:rgba(13,23,39,.9);border:1px solid var(--border);border-radius:16px;padding:13px;text-align:center}.stat strong{display:block;font-size:1.35rem}.stat span{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em}.group{margin:18px 0}.groupTitle{display:flex;align-items:center;gap:9px;color:#dff8ff;font-weight:950;font-size:1rem;letter-spacing:.03em;margin:0 0 10px;padding-left:4px}.events{display:grid;gap:10px}.event{background:linear-gradient(145deg,rgba(14,25,42,.98),rgba(9,16,29,.98));border:1px solid var(--border);border-radius:18px;padding:15px 16px;outline:none;position:relative;overflow:hidden}.event:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,229,255,.13),0 12px 34px rgba(0,0,0,.3)}.eventMeta{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:.77rem;margin-bottom:10px}.status{font-weight:950;text-transform:uppercase;letter-spacing:.06em}.status.final{color:var(--green)}.status.live{color:var(--red)}.status.next{color:var(--orange)}.teams{display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:center}.team{font-weight:850;font-size:clamp(.95rem,2.1vw,1.13rem);overflow-wrap:anywhere}.score{font-weight:950;font-size:1.22rem;color:white;min-width:30px;text-align:right}.league{color:#7190a8}.empty,.loading,.error{text-align:center;padding:40px 18px;border:1px dashed rgba(130,190,230,.22);border-radius:20px;color:var(--muted);background:rgba(13,23,39,.55)}.error{color:#ff9cab;border-color:rgba(255,91,111,.26)}.foot{text-align:center;color:#607a91;font-size:.74rem;margin-top:24px;line-height:1.5}@media(max-width:560px){body{padding-top:16px}.summary{grid-template-columns:1fr 1fr 1fr}.event{padding:14px}.stamp{display:none}.top{margin-bottom:8px}}@media(min-width:800px){.events{grid-template-columns:repeat(2,minmax(0,1fr))}.event{min-height:125px}}
</style>
</head>
<body oncontextmenu="return false">
<main class="wrap">
  <div class="top"><a class="back" href="cliente.html" id="backBtn">← Portal</a><div class="stamp" id="updatedText">Actualizando…</div></div>
  <section class="hero"><small>M17LIV3</small><h1>Resultados del día</h1><p id="dateText"></p></section>
  <nav class="filters" id="filters" aria-label="Filtrar por deporte"></nav>
  <section class="summary"><div class="stat"><strong id="countAll">0</strong><span>Eventos</span></div><div class="stat"><strong id="countFinal">0</strong><span>Finalizados</span></div><div class="stat"><strong id="countLive">0</strong><span>En directo</span></div></section>
  <div id="content"><div class="loading">Consultando resultados deportivos…</div></div>
  <div class="foot">Datos deportivos proporcionados por TheSportsDB · La disponibilidad del plan gratuito puede variar según deporte y competición.</div>
</main>
<script>
(function(){
 const API_PROXY='https://qjbnjhojwhcndcfjcyrc.supabase.co/functions/v1/resultados-dia';
 const FREE='https://www.thesportsdb.com/api/v1/json/123/eventsday.php';
 const sports=['Soccer','Basketball','Tennis','Motorsport'];
 const labels={Soccer:'⚽ Fútbol',Football:'⚽ Fútbol',Basketball:'🏀 Baloncesto',Tennis:'🎾 Tenis',Motorsport:'🏎️ Motor'};
 let events=[],active='Todos',focusables=[];
 const qs=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
 const localDate=()=>{const d=new Date(),y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`};
 function formatDate(){return new Intl.DateTimeFormat('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date()).replace(/^./,c=>c.toUpperCase())}
 function normalize(e){let hs=e.intHomeScore??e.intHomeScoreTotal??'',as=e.intAwayScore??e.intAwayScoreTotal??'';let st=(e.strStatus||e.strProgress||'').toUpperCase();let hasScore=hs!==''&&hs!==null&&as!==''&&as!==null;let kind=(['FT','AET','AOT','AP','FINAL','FINISHED'].some(x=>st.includes(x))||hasScore)?'final':(['NS','NOT STARTED',''].includes(st)?'next':'live');return {id:e.idEvent||Math.random(),sport:e.strSport||'Otros',league:e.strLeague||'',home:e.strHomeTeam||e.strEvent||'Evento',away:e.strAwayTeam||'',homeScore:hs,awayScore:as,status:e.strStatus||e.strProgress||'',time:e.strTime||e.strEventTime||'',kind};}
 async function directFallback(date){let all=[];for(const sport of sports){try{let r=await fetch(`${FREE}?d=${date}&s=${encodeURIComponent(sport)}&_=${Date.now()}`,{cache:'no-store'});let j=await r.json();all=all.concat((j.events||[]).map(normalize));}catch(e){}}return all;}
 async function load(){const date=localDate();qs('#dateText').textContent=formatDate();try{let r=await fetch(`${API_PROXY}?date=${date}&_=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw new Error('proxy');let j=await r.json();events=(j.events||[]).map(x=>x.kind?x:normalize(x));}catch(e){events=await directFallback(date);}events=events.filter((e,i,a)=>a.findIndex(x=>String(x.id)===String(e.id))===i);qs('#updatedText').textContent='Actualizado ' + new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});renderFilters();render();}
 function sportLabel(s){return labels[s]||('🏅 '+s)}
 function renderFilters(){let names=['Todos',...Array.from(new Set(events.map(e=>e.sport))).sort()];qs('#filters').innerHTML=names.map((n,i)=>`<button class="filter ${n===active?'active':''}" data-filter="${esc(n)}" tabindex="0">${n==='Todos'?'Todos':sportLabel(n)}</button>`).join('');qs('#filters').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{active=b.dataset.filter;renderFilters();render();}));}
 function render(){let list=active==='Todos'?events:events.filter(e=>e.sport===active);qs('#countAll').textContent=list.length;qs('#countFinal').textContent=list.filter(e=>e.kind==='final').length;qs('#countLive').textContent=list.filter(e=>e.kind==='live').length;if(!list.length){qs('#content').innerHTML='<div class="empty">No hay resultados disponibles para este filtro en el plan gratuito.</div>';refreshFocus();return;}let groups={};list.forEach(e=>(groups[e.sport]||(groups[e.sport]=[])).push(e));qs('#content').innerHTML=Object.entries(groups).map(([sport,arr])=>`<section class="group"><h2 class="groupTitle">${sportLabel(sport)}</h2><div class="events">${arr.map(eventHtml).join('')}</div></section>`).join('');refreshFocus();}
 function eventHtml(e){let status=e.kind==='final'?'Finalizado':e.kind==='live'?(e.status||'En directo'):(e.time||'Próximamente');return `<article class="event" tabindex="0"><div class="eventMeta"><span class="league">${esc(e.league)}</span><span class="status ${e.kind}">${esc(status)}</span></div><div class="teams"><div class="team">${esc(e.home)}</div><div class="score">${esc(e.homeScore)}</div>${e.away?`<div class="team">${esc(e.away)}</div><div class="score">${esc(e.awayScore)}</div>`:''}</div></article>`;}
 function refreshFocus(){focusables=[qs('#backBtn'),...document.querySelectorAll('.filter'),...document.querySelectorAll('.event')].filter(Boolean);}
 document.addEventListener('keydown',e=>{if(e.key==='Escape'||e.key==='BrowserBack'){location.href='cliente.html';return;}if(!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))return;refreshFocus();let cur=focusables.indexOf(document.activeElement);if(cur<0)cur=0;let step=(e.key==='ArrowLeft'||e.key==='ArrowUp')?-1:1;e.preventDefault();let next=Math.max(0,Math.min(focusables.length-1,cur+step));focusables[next].focus({preventScroll:false});});
 document.addEventListener('copy',e=>e.preventDefault());document.addEventListener('cut',e=>e.preventDefault());document.addEventListener('dragstart',e=>e.preventDefault());
 load();setInterval(load,120000);
})();
</script>
</body>
</html>
