<!doctype html>
<html lang="es">
<head>

<title>M17LIV3 · Resultados eventos finalizados</title>
<style>
:root{--bg:#050812;--panel:#0b1422;--text:#f5fbff;--muted:#8da3b8;--cyan:#00e5ff;--green:#77ff58;--border:rgba(130,190,230,.17);--focus:0 0 0 4px rgba(119,255,88,.15),0 0 34px rgba(119,255,88,.20)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -8%,rgba(0,229,255,.12),transparent 30%),radial-gradient(circle at 90% 100%,rgba(119,255,88,.07),transparent 27%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;user-select:none;-webkit-user-select:none}body{padding:max(18px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(30px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));overflow-x:hidden}.wrap{width:min(1180px,100%);margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.action{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;color:var(--cyan);text-decoration:none;border:2px solid rgba(0,229,255,.30);background:rgba(0,229,255,.07);padding:13px 20px;border-radius:16px;font-weight:950;outline:none;position:relative;letter-spacing:.02em}.action.refresh{color:var(--green);border-color:rgba(119,255,88,.24);background:rgba(119,255,88,.06)}.action:focus,.action:focus-visible{border-color:var(--green);color:#fff;background:linear-gradient(135deg,rgba(0,229,255,.20),rgba(119,255,88,.17));box-shadow:0 0 0 4px rgba(119,255,88,.32),0 0 38px rgba(0,229,255,.30),0 0 58px rgba(119,255,88,.22);transform:scale(1.08);z-index:5}.action:focus::after,.action:focus-visible::after{content:"SELECCIONADO";position:absolute;left:50%;top:calc(100% + 8px);transform:translateX(-50%);font-size:.60rem;line-height:1;background:var(--green);color:#04100a;padding:5px 8px;border-radius:999px;letter-spacing:.08em;white-space:nowrap;box-shadow:0 0 16px rgba(119,255,88,.38)}.hero{text-align:center;margin:16px 0 20px}.brand{color:var(--cyan);font-size:.78rem;font-weight:950;letter-spacing:.22em;text-transform:uppercase}.heroIcon{width:72px;height:72px;margin:10px auto 12px;border-radius:21px;border:1px solid rgba(119,255,88,.22);background:rgba(119,255,88,.07);color:var(--green);display:grid;place-items:center;box-shadow:0 0 28px rgba(119,255,88,.08)}.heroIcon svg{width:46px;height:46px;filter:drop-shadow(0 0 8px rgba(119,255,88,.25))}.hero h1{font-size:clamp(1.8rem,4.7vw,4rem);letter-spacing:-.05em;line-height:1.02;margin:0 0 8px}.hero p{margin:0;color:var(--muted);font-size:clamp(.9rem,1.7vw,1.06rem)}.summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin:0 auto 20px;max-width:720px}.stat{background:linear-gradient(145deg,rgba(14,25,42,.96),rgba(9,16,29,.96));border:1px solid var(--border);border-radius:18px;padding:15px;text-align:center}.stat strong{display:block;font-size:clamp(1.5rem,3vw,2rem);line-height:1.1}.stat.final strong{color:var(--green)}.stat span{display:block;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;margin-top:5px}.leagueGroup{margin:20px 0}.leagueTitle{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 10px;padding:0 4px}.leagueTitle h2{font-size:1rem;margin:0}.leagueTitle span{color:var(--muted);font-size:.76rem}.events{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.event{background:linear-gradient(145deg,rgba(15,27,46,.98),rgba(8,16,29,.98));border:1px solid var(--border);border-radius:19px;padding:16px 17px;outline:none;position:relative;overflow:hidden}.event:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--green);box-shadow:0 0 14px rgba(119,255,88,.5)}.event:focus,.event:focus-visible{border:3px solid var(--green);background:linear-gradient(145deg,rgba(18,43,58,.99),rgba(10,28,37,.99));box-shadow:0 0 0 4px rgba(119,255,88,.26),0 0 36px rgba(0,229,255,.24),0 0 52px rgba(119,255,88,.20);transform:scale(1.035);z-index:3}.event:focus::after,.event:focus-visible::after{content:"SELECCIONADO";position:absolute;right:12px;bottom:10px;padding:5px 9px;border-radius:999px;background:var(--green);color:#04100a;font-size:.60rem;font-weight:950;letter-spacing:.08em;box-shadow:0 0 18px rgba(119,255,88,.35)}.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.competition{color:#7f9ab0;font-size:.76rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:72%}.status{font-size:.69rem;font-weight:950;text-transform:uppercase;letter-spacing:.06em;border-radius:999px;padding:5px 8px;color:#caffbb;background:rgba(119,255,88,.09);border:1px solid rgba(119,255,88,.18)}.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px 16px;align-items:center}.teamWrap{display:flex;align-items:center;gap:9px;min-width:0}.teamLogo{width:26px;height:26px;object-fit:contain;flex:0 0 auto}.team{font-weight:900;font-size:clamp(.96rem,2vw,1.12rem);overflow-wrap:anywhere}.score{font-size:1.38rem;font-weight:950;min-width:36px;text-align:right;color:#fff}.loading,.empty,.error{text-align:center;padding:50px 18px;border:1px dashed rgba(130,190,230,.22);border-radius:20px;color:var(--muted);background:rgba(13,23,39,.55)}.error{color:#ff9cab;border-color:rgba(255,93,116,.28)}.foot{text-align:center;color:#5f788e;font-size:.73rem;margin-top:26px;line-height:1.55}.source{color:#7894a9}.updated{color:#7790a5;font-size:.77rem;text-align:center;margin:9px 0 0}
.sportSection{margin:22px 0 6px}.sportHeader{display:flex;align-items:center;gap:10px;margin:0 0 10px;padding:0 4px}.sportIcon{font-size:1.25rem}.sportHeader h2{margin:0;font-size:1.08rem}.sportHeader small{color:var(--muted)}
@media(max-width:700px){.events{grid-template-columns:1fr}.top{align-items:stretch}.action{padding:10px 12px}.hero{margin-top:10px}.event{min-height:0}}
@media(prefers-reduced-motion:no-preference){.event,.action{transition:.16s ease}}
</style>
</head>
<body oncontextmenu="return false">
<main class="wrap">
  <div class="top">
    <a class="action" href="cliente.html" id="backBtn" tabindex="0">← ATRÁS</a>
    <button class="action refresh" type="button" id="refreshBtn" tabindex="0">↻ ACTUALIZAR</button>
  </div>
  <section class="hero">
    <div class="brand">M17LIV3</div>
    <div class="heroIcon" aria-hidden="true">
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="7" y="12" width="50" height="40" rx="6" stroke="currentColor" stroke-width="3"/>
        <path d="M17 22H27M17 30H27M37 22H47M37 30H47" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        <path d="M20 40L25 45L35 35" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M41 40H49" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>RESULTADOS EVENTOS FINALIZADOS</h1>
    <p id="dateText"></p>
    <div class="updated" id="updatedText">Conectando…</div>
  </section>
  <section class="summary" aria-label="Resumen">
    <div class="stat final"><strong id="countFinal">0</strong><span>Resultados encontrados</span></div>
    <div class="stat"><strong id="countDay">0</strong><span>Eventos de la cartelera</span></div>
  </section>
  <div id="content"><div class="loading">Consultando resultados finalizados…</div></div>
  <div class="foot">Solo se muestran eventos finalizados de la cartelera · Actualización automática cada 10 minutos.</div>
</main>
<script src="config.js"></script>
<script>
(function(){
 const API_PROXY='https://qjbnjhojwhcndcfjcyrc.supabase.co/functions/v1/resultados-dia';
 const cfg=window.M17_CONFIG||{};
 const BIN_ID=cfg.cartBinId||'';
 const BIN_KEY=cfg.cartKey||'';
 // Fuentes automáticas activas en V35. El resto se omite para evitar resultados incorrectos.
 const SUPPORTED=new Set(['Football','Tennis']);
 const ICONS={Football:'⚽',Tennis:'🎾',Basketball:'🏀',Baseball:'⚾',Hockey:'🏒',Handball:'🤾',Volleyball:'🏐',NFL:'🏈',Rugby:'🏉',Padel:'🎾',Cycling:'🚴',Golf:'⛳',Motorsport:'🏍️',Swimming:'🏊',Unknown:'•'};
 let matches=[],offered=[];
 const $=s=>document.querySelector(s);
 const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
 function localDate(offsetDays=0){const d=new Date();d.setDate(d.getDate()+offsetDays);const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
 function isEarlyTime(t){const m=String(t||'').match(/^(\d{1,2}):(\d{2})$/);if(!m)return false;const mins=Number(m[1])*60+Number(m[2]);return mins<180}
 function formatDate(){return new Intl.DateTimeFormat('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date()).replace(/^./,c=>c.toUpperCase())}
 function normalize(v){return String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\b(fc|cf|afc|sc|ac|cd|ud|ue|sd|rc|club|deportivo|deportes|futbol|football|soccer|women|woman|femenino|femenina|team)\b/g,' ').replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim()}
 function toks(v){return normalize(v).split(' ').filter(x=>x.length>1)}
 function sim(a,b){a=normalize(a);b=normalize(b);if(!a||!b)return 0;if(a===b)return 1;if(a.includes(b)||b.includes(a))return .92;const A=toks(a),B=toks(b);if(!A.length||!B.length)return 0;let hit=0;for(const x of A){if(B.some(y=>x===y||(x.length>=4&&y.length>=4&&(x.startsWith(y)||y.startsWith(x)))))hit++}return hit/Math.max(A.length,B.length)}
 function sportMap(s){const t=String(s||'').toLowerCase();if(/padel|pádel/.test(t))return 'Padel';if(/tenis|tennis|atp|wta/.test(t))return 'Tennis';if(/cicl|cycling/.test(t))return 'Cycling';if(/golf/.test(t))return 'Golf';if(/moto|motogp|motocicl|formula|f1/.test(t))return 'Motorsport';if(/nataci|swim/.test(t))return 'Swimming';if(/basket/.test(t))return 'Basketball';if(/base|beisbol|béisbol/.test(t))return 'Baseball';if(/hockey/.test(t))return 'Hockey';if(/hand|balonmano/.test(t))return 'Handball';if(/volley|voleibol/.test(t))return 'Volleyball';if(/nfl|futbol americano|fútbol americano/.test(t))return 'NFL';if(/rugby/.test(t))return 'Rugby';if(/foot|soccer|futbol|fútbol/.test(t))return 'Football';return 'Unknown'}
 function cleanParticipant(v){let s=String(v||'').replace(/\s+(?:📺|🗂)\s*(?:CANAL|CARPETA)?\s*:?.*$/i,'').replace(/\s+[|·]\s+.*$/,'').trim();const flags=[...s.matchAll(/[\u{1F1E6}-\u{1F1FF}]{2}\s*/gu)];if(flags.length){const m=flags[flags.length-1];s=s.slice((m.index||0)+m[0].length).trim()}return s.replace(/^[^\p{L}\p{N}]+/u,'').trim()}
 function cleanOfferedEvent(o){if(!o||typeof o!=='object')return o;const x={...o};x.home=cleanParticipant(x.home);x.away=cleanParticipant(x.away);/* Compatibilidad con datos ya publicados por versiones anteriores: si el segundo participante quedó contaminado con CANAL/CARPETA, se limpia aquí sin exigir volver a publicar. */if((!x.home||!x.away)&&x.sourceLine){const t=parseText(x.sourceLine);if(t[0]&&t[0].type==='match'){x.home=cleanParticipant(t[0].home);x.away=cleanParticipant(t[0].away)}}return x}
 function parseText(text){let current='Unknown',out=[];for(const raw of String(text||'').split(/\r?\n/)){let line=raw.replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim();if(!line)continue;if(!/^⏰/.test(line)&&!/^\d{1,2}[:.]\d{2}/.test(line)){const h=sportMap(line);if(h!=='Unknown'&&!/^📺|^🗂/.test(line)&&line.length<90)current=h;continue}const tm=(line.match(/(?:^|⏰\s*)([0-2]?\d[:.][0-5]\d)/)||[])[1]||'';let title=line.replace(/^\s*⏰\s*[0-2]?\d[:.][0-5]\d\s*[-–—|·:]?\s*/,'').replace(/^\s*[0-2]?\d[:.][0-5]\d\s*[-–—|·:]?\s*/,'').trim();if(!title)continue;let home='',away='',type='event';const sep=title.match(/\s*(?:🆚|\bvs\.?\b|\bv\.?\b|\bcontra\b)\s*/i);if(sep){let left=title.slice(0,sep.index).trim(),right=title.slice(sep.index+sep[0].length).trim();if(left.includes(':'))left=left.split(':').pop().trim();home=cleanParticipant(left);away=cleanParticipant(right);if(home&&away)type='match'}out.push({sport:current,type,title,home,away,time:tm.replace('.',':'),sourceLine:line})}return out}
 async function loadPublished(){if(!BIN_ID||!BIN_KEY)return {events:[],text:'',date:''};const r=await fetch(`https://api.jsonbin.io/v3/b/${encodeURIComponent(BIN_ID)}/latest?_=${Date.now()}`,{cache:'no-store',headers:{'X-Master-Key':BIN_KEY,'X-Access-Key':BIN_KEY}});if(!r.ok)throw new Error('No se pudo leer la programación publicada');const j=await r.json(),rec=j.record||{};if(rec.eventos_fecha&&rec.eventos_fecha!==localDate())return {events:[],date:rec.eventos_fecha||'',text:rec.texto||''};const parsedFromText=parseText(rec.texto||'');const stored=Array.isArray(rec.eventos_datos)?rec.eventos_datos:[];/* V40: para resultados preferimos SIEMPRE reconstruir los eventos desde el texto publicado actual. Así no dependemos de eventos_datos generados por parsers de versiones anteriores y evitamos nombres/sport/time contaminados. Solo usamos eventos_datos si no existe texto parseable. */const list=parsedFromText.length?parsedFromText:stored;return {events:list,date:rec.eventos_fecha||'',text:rec.texto||''}}
 function apiId(e){return String(e?.event_id??e?.id??'')}
 function apiSides(e){const sport=sportMap(e?.sport);if(sport==='Tennis')return {a:e.away||'',b:e.home||'',aScore:e.score_away,bScore:e.score_home};return {a:e.home||'',b:e.away||'',aScore:e.score_home,bScore:e.score_away}}
 function matchOne(o,list,used){if(!o||o.type!=='match'||!o.home||!o.away)return null;const os=sportMap(o.sport);let best=null,bs=0;for(const e of list){const id=apiId(e);if(!id||used.has(id))continue;const es=sportMap(e.sport);if(os!=='Unknown'&&es!=='Unknown'&&os!==es)continue;const x=apiSides(e);const direct=(sim(o.home,x.a)+sim(o.away,x.b))/2;const swapped=(sim(o.home,x.b)+sim(o.away,x.a))/2;const score=Math.max(direct,swapped);if(score>bs){bs=score;best={api:e,score,swapped:swapped>direct,sides:x}}}return bs>=.62?best:null}
 function matchEvents(offeredList,apiList){const used=new Set(),found=[],missing=[];for(const o of offeredList){if(o.type!=='match'||!SUPPORTED.has(sportMap(o.sport)))continue;const m=matchOne(o,apiList,used);if(m){used.add(apiId(m.api));found.push({offered:o,...m})}else missing.push(o)}return {found,missing}}
 function setsText(x){const e=x.api;if(sportMap(e.sport)!=='Tennis')return '';let a=Array.isArray(e.sets_away)?[...e.sets_away]:[],h=Array.isArray(e.sets_home)?[...e.sets_home]:[];/* TheRundown: away/home. Determine published order directly. */const pubA=x.offered.home,pubB=x.offered.away;const awayFirst=(sim(pubA,e.away)>=sim(pubA,e.home));if(!awayFirst)[a,h]=[h,a];return a.map((v,i)=>`${v}-${h[i]??'—'}`).join(' · ')}
 function displayScores(x){const e=x.api,o=x.offered,s=sportMap(e.sport);if(s==='Tennis'){const firstIsAway=sim(o.home,e.away)>=sim(o.home,e.home);return firstIsAway?[e.score_away,e.score_home]:[e.score_home,e.score_away]}const firstIsHome=sim(o.home,e.home)>=sim(o.home,e.away);return firstIsHome?[e.score_home,e.score_away]:[e.score_away,e.score_home]}
 function competitionText(e){if(sportMap(e.sport)==='Tennis')return [e.league,e.tournament,e.round].filter(Boolean).join(' · ');return [e.competition,e.competition_code].filter(Boolean).join(' · ')}
 function eventHtml(x){const e=x.api,o=x.offered,[s1,s2]=displayScores(x),isTennis=sportMap(e.sport)==='Tennis',sets=isTennis?setsText(x):'';const retired=e.status==='STATUS_RETIRED';return `<article class="event" tabindex="0"><div class="meta"><span class="competition">${esc(competitionText(e))}</span><span class="status">${retired?'Retirado':'Finalizado'}</span></div><div class="row"><div class="teamWrap"><div class="team">${esc(o.home)}</div></div><div class="score">${esc(s1??'—')}</div><div class="teamWrap"><div class="team">${esc(o.away)}</div></div><div class="score">${esc(s2??'—')}</div></div>${sets?`<div style="margin-top:10px;color:#9bb1c5;font-size:.82rem">Sets: <b style="color:#dff8ff">${esc(sets)}</b></div>`:''}</article>`}
 function render(){$('#countFinal').textContent=matches.length;if(!matches.length){$('#content').innerHTML='<div class="empty"><b style="color:#dff8ff">Todavía no hay resultados finalizados disponibles.</b><br><span style="display:inline-block;margin-top:8px">Vuelve a consultar en unos minutos.</span></div>';return}const sports={};for(const x of matches){const s=sportMap(x.api.sport);(sports[s]||(sports[s]=[])).push(x)}$('#content').innerHTML=Object.entries(sports).map(([sport,arr])=>{const label=sport==='Football'?'Fútbol':sport==='Tennis'?'Tenis':sport;return `<section class="sportSection"><div class="sportHeader"><span class="sportIcon">${ICONS[sport]||'•'}</span><h2>${esc(label)}</h2><small>${arr.length} ${arr.length===1?'resultado':'resultados'}</small></div><div class="events">${arr.map(eventHtml).join('')}</div></section>`}).join('')}
 async function fetchResults(date,sports,force=false){
   if(!sports.length)return [];
   const forcePart=force?'&force=1':'';
   const apiResponse=await fetch(`${API_PROXY}?date=${date}&sports=${encodeURIComponent(sports.join(','))}${forcePart}`,{cache:'no-store'});
   const j=await apiResponse.json();
   if(!apiResponse.ok||j.error)throw new Error(j.error||`Respuesta ${apiResponse.status}`);
   return Array.isArray(j.events)?j.events:[];
 }
 function dedupeEvents(list){const seen=new Set(),out=[];for(const e of list){const id=apiId(e)||`${e?.sport||''}|${e?.event_date||''}|${e?.home||''}|${e?.away||''}`;if(seen.has(id))continue;seen.add(id);out.push(e)}return out}
 async function load(force=false){
   $('#dateText').textContent=formatDate();$('#updatedText').textContent='Actualizando…';$('#refreshBtn').disabled=true;
   try{
     const published=await loadPublished();offered=(published.events||[]).map(cleanOfferedEvent);$('#countDay').textContent=offered.length;
     const requested=[...new Set(offered.map(o=>sportMap(o.sport)).filter(s=>SUPPORTED.has(s)))];
     const earlySports=[...new Set(offered.filter(o=>o.type==='match'&&isEarlyTime(o.time)).map(o=>sportMap(o.sport)).filter(s=>SUPPORTED.has(s)))];
     let apiEvents=[];
     if(requested.length) apiEvents.push(...await fetchResults(localDate(),requested,force));
     /*
       TheRundown Free permite 1 petición/segundo. Cada consulta de tenis ya hace
       ATP y WTA de forma secuencial. Si acto seguido pedimos también el día
       anterior, el ATP de esa segunda consulta puede recibir 429 y quedar fuera
       silenciosamente. Dejamos margen entre ambas consultas para que los eventos
       de madrugada (como Lehecka–Jódar) no desaparezcan.
     */
     if(earlySports.length){
       await new Promise(resolve=>setTimeout(resolve,1600));
       apiEvents.push(...await fetchResults(localDate(-1),earlySports,force));
     }
     apiEvents=dedupeEvents(apiEvents);
     const result=matchEvents(offered,apiEvents);matches=result.found;
     $('#updatedText').textContent='Actualizado '+new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});render();
   }catch(err){matches=[];$('#countFinal').textContent='0';$('#countDay').textContent=offered.length||'—';$('#updatedText').textContent='No se pudo actualizar';$('#content').innerHTML=`<div class="error">${esc(err?.message||'No se pudieron consultar los resultados.')}</div>`}
   finally{$('#refreshBtn').disabled=false}
 }
 function cards(){return Array.from(document.querySelectorAll('.event'))}
 $('#refreshBtn').addEventListener('click',()=>load(true));
 document.addEventListener('keydown',e=>{const key=e.key,cs=cards(),el=document.activeElement;if(key==='Escape'||key==='BrowserBack'||key==='GoBack'){e.preventDefault();location.href='cliente.html';return}if(el===$('#backBtn')&&key==='ArrowRight'){e.preventDefault();$('#refreshBtn').focus();return}if(el===$('#refreshBtn')&&key==='ArrowLeft'){e.preventDefault();$('#backBtn').focus();return}if((el===$('#backBtn')||el===$('#refreshBtn'))&&key==='ArrowDown'&&cs.length){e.preventDefault();cs[0].focus();return}if(cs.includes(el)){let i=cs.indexOf(el),cols=window.innerWidth>700?2:1;if(key==='ArrowDown'){e.preventDefault();cs[Math.min(cs.length-1,i+cols)].focus();return}if(key==='ArrowUp'){e.preventDefault();const ni=i-cols;if(ni<0)$('#backBtn').focus();else cs[ni].focus();return}if(key==='ArrowLeft'||key==='ArrowRight'){e.preventDefault();cs[Math.max(0,Math.min(cs.length-1,i+(key==='ArrowRight'?1:-1)))].focus();return}}});
 document.addEventListener('copy',e=>e.preventDefault());document.addEventListener('cut',e=>e.preventDefault());document.addEventListener('dragstart',e=>e.preventDefault());
 load(false);setTimeout(()=>{try{$('#backBtn').focus({preventScroll:true})}catch(_){$('#backBtn').focus()}},150);setInterval(()=>load(false),600000);
})()
</script>
</body>
</html>
