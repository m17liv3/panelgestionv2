<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050914">
  <meta name="color-scheme" content="dark">
  <title>M17LIV3 · Cartelera del día</title>
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <style>
    :root {
      --bg:#050914;
      --panel:#0c1422;
      --panel2:#101b2c;
      --text:#eef7ff;
      --muted:#7f9ab2;
      --cyan:#00d8ff;
      --green:#6cff43;
      --border:rgba(134,188,224,.16);
      --safe:env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing:border-box; }
    html { min-height:100%; background:var(--bg); }
    body {
      min-height:100vh;
      margin:0;
      color:var(--text);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:
        radial-gradient(circle at 50% -8%, rgba(0,216,255,.16), transparent 31rem),
        radial-gradient(circle at 100% 34%, rgba(108,255,67,.07), transparent 25rem),
        linear-gradient(180deg,#07101e 0%,#050914 52%,#03060d 100%);
    }
    body::before {
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:.18;
      background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
      background-size:26px 26px;
      mask-image:linear-gradient(to bottom,#000,transparent 75%);
    }
    button { font:inherit; }
    .page {
      position:relative;
      width:min(920px,100%);
      margin:0 auto;
      padding:14px 15px calc(34px + var(--safe));
    }
    .intro {
      margin-bottom:18px;
      padding:17px 18px;
      border:1px solid var(--border);
      border-radius:20px;
      background:linear-gradient(145deg,rgba(14,29,48,.86),rgba(8,15,27,.88));
      box-shadow:0 18px 55px rgba(0,0,0,.28),inset 0 1px rgba(255,255,255,.035);
    }
    .eyebrow {
      color:var(--cyan);
      font-size:.68rem;
      font-weight:900;
      letter-spacing:.18em;
      text-transform:uppercase;
    }
    .dateLine {
      margin-top:6px;
      color:var(--text);
      font-size:1.02rem;
      text-transform:capitalize;
    }
    .heroTitleRow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:6px}
    .heroCount{font-size:clamp(2.8rem,9vw,4rem);line-height:1;font-weight:1000;letter-spacing:-.05em;color:var(--cyan)}
    .heroLabel{font-size:clamp(2rem,6vw,3.35rem);line-height:1.02;font-weight:950;letter-spacing:-.05em;color:var(--text)}

    .status {
      display:flex;
      align-items:center;
      gap:10px;
      min-height:54px;
      padding:13px 15px;
      margin-bottom:14px;
      border:1px solid var(--border);
      border-radius:16px;
      color:var(--muted);
      background:rgba(12,20,34,.76);
    }
    .spinner {
      width:20px;
      height:20px;
      border:2px solid rgba(0,216,255,.18);
      border-top-color:var(--cyan);
      border-radius:50%;
      animation:spin .75s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }
    .eventCard,.scheduleCard {
      overflow:hidden;
      margin-bottom:15px;
      border:1px solid var(--border);
      border-radius:21px;
      background:linear-gradient(145deg,rgba(13,25,42,.92),rgba(7,13,24,.94));
      box-shadow:0 22px 60px rgba(0,0,0,.32),inset 0 1px rgba(255,255,255,.035);
    }
    .sectionLabel {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:11px 16px;
      color:var(--cyan);
      font-size:.67rem;
      font-weight:900;
      letter-spacing:.18em;
      text-transform:uppercase;
      border-bottom:1px solid var(--border);
      background:linear-gradient(90deg,rgba(0,216,255,.09),rgba(108,255,67,.035));
    }
    .sectionLabel .live {
      display:inline-flex;
      align-items:center;
      gap:6px;
      color:var(--green);
      letter-spacing:.08em;
    }
    .sectionLabel .live::before {
      content:"";
      width:7px;
      height:7px;
      border-radius:50%;
      background:var(--green);
      box-shadow:0 0 12px var(--green);
    }
    .eventImageWrap { background:#000; }
    .eventImage {
      display:block;
      width:100%;
      height:auto;
      max-height:70vh;
      object-fit:contain;
    }

    .brandMini{color:var(--green);font-weight:950;letter-spacing:.04em}

    .scheduleBody { padding:18px; }
    .scheduleText {
      margin:0;
      color:var(--text);
      font-family:inherit;
      font-size:clamp(.94rem,3.4vw,1.06rem);
      line-height:1.72;
      white-space:pre-wrap;
      overflow-wrap:anywhere;
    }
    .empty {
      padding:34px 20px;
      text-align:center;
      color:var(--muted);
    }
    .emptyIcon { font-size:2rem; margin-bottom:9px; }
    .empty strong { display:block; color:var(--text); margin-bottom:5px; }
    .footer {
      padding:10px 4px 0;
      text-align:center;
      color:rgba(127,154,178,.72);
      font-size:.72rem;
    }
    .updated { margin-top:5px; }

    .scheduleBody{padding:0}
    .scheduleText{display:none}
    .scheduleTableWrap{width:100%;overflow:hidden}
    .scheduleTable{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}
    .scheduleTable thead th{padding:12px 14px;color:var(--cyan);font-size:.68rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;text-align:left;background:rgba(0,216,255,.045);border-bottom:1px solid var(--border)}
    .scheduleTable td{padding:12px 14px;border-top:1px solid rgba(255,255,255,.045);vertical-align:middle;font-size:.9rem}
    .scheduleTable tbody tr:nth-child(even){background:rgba(255,255,255,.012)}
    .timeCell{width:72px;color:var(--cyan);font-size:.96rem;font-weight:950;white-space:nowrap}
    .sportCell{display:none}
    .eventCell{color:var(--text);font-weight:850;line-height:1.35;white-space:normal;overflow-wrap:anywhere}
    .channelCell{width:135px;color:#d6e5ee;font-size:.76rem}
    .folderCell{width:145px;color:#bfff7c;font-size:.70rem;font-weight:850}
    .sportGroupRow td{padding:10px 14px;color:#e9fbff;font-size:.82rem;font-weight:950;letter-spacing:.05em;background:linear-gradient(90deg,rgba(0,216,255,.08),rgba(108,255,67,.035));border-top:1px solid rgba(0,216,255,.13);border-bottom:1px solid rgba(0,216,255,.08)}
    .sportGroupRow small{margin-left:8px;color:var(--muted);font-size:.68rem;font-weight:750}
    
    .statusCell{width:165px;text-align:right;padding-right:14px!important}
    .eventStatus{
      display:inline-flex;align-items:center;gap:7px;
      padding:5px 8px;border-radius:999px;
      font-size:.64rem;font-weight:900;letter-spacing:.035em;
      white-space:nowrap;border:1px solid rgba(255,255,255,.08)
    }
    .eventStatus .statusDot{
      width:7px;height:7px;border-radius:50%;flex:0 0 7px
    }
    .eventStatus.upcoming{
      color:#dffcff;background:rgba(0,216,255,.055);
      border-color:rgba(0,216,255,.18)
    }
    .eventStatus.upcoming .statusDot{
      background:var(--cyan);animation:m17StatusPulse 1.6s infinite
    }
    .eventStatus.soon{
      color:#efffd0;background:rgba(198,255,54,.07);
      border-color:rgba(198,255,54,.24)
    }
    .eventStatus.soon .statusDot{
      background:#c6ff36;animation:m17StatusPulse 1.05s infinite
    }
    .eventStatus.live{
      color:#d6ffd1;background:rgba(96,255,102,.09);
      border-color:rgba(96,255,102,.28)
    }
    .eventStatus.live .statusDot{
      background:#62ff6e;animation:m17LivePulse .85s infinite
    }
    .eventStatus.finished{
      color:#9fb3bf;background:rgba(159,179,191,.055);
      border-color:rgba(159,179,191,.12)
    }
    .eventStatus.finished .statusDot{background:#718691}
    @keyframes m17StatusPulse{
      0%{box-shadow:0 0 0 0 rgba(0,216,255,.38);transform:scale(.95)}
      60%{box-shadow:0 0 0 8px rgba(0,216,255,0);transform:scale(1.08)}
      100%{box-shadow:0 0 0 0 rgba(0,216,255,0);transform:scale(.95)}
    }
    @keyframes m17LivePulse{
      0%,100%{opacity:1;transform:scale(1)}
      50%{opacity:.45;transform:scale(.82)}
    }


    .scheduleTable th:last-child,
    .scheduleTable td:last-child{padding-right:14px}
    @media(min-width:761px){
      .scheduleTableWrap{overflow:hidden}
      .scheduleTable{min-width:0}
      .scheduleTable th,.scheduleTable td{box-sizing:border-box}
    }

@media(max-width:760px){
      .scheduleTable thead{display:none}
      .scheduleTable,.scheduleTable tbody,.scheduleTable tr,.scheduleTable td{display:block;width:100%}
      .scheduleTable tbody tr{padding:10px 13px}
      .scheduleTable td{padding:3px 0;border:0!important}
      .timeCell{font-size:1rem}
      .eventCell{font-size:.93rem;white-space:normal}
      .channelCell,.folderCell{font-size:.74rem}
      .sportGroupRow{padding:0!important}
      .sportGroupRow td{padding:9px 13px!important}
    }



    /* Protección visual básica: evita selección, arrastre y pulsación prolongada. */
    html, body, body * {
      -webkit-user-select:none;
      -moz-user-select:none;
      -ms-user-select:none;
      user-select:none;
      -webkit-touch-callout:none;
    }
    img, svg {
      -webkit-user-drag:none;
      user-drag:none;
      pointer-events:none;
    }
    .eventImageWrap {
      position:relative;
      overflow:hidden;
    }
    .eventImageWrap::after {
      content:"";
      position:absolute;
      inset:0;
      z-index:2;
      background:transparent;
      pointer-events:auto;
    }

    [hidden] { display:none !important; }
    @media (min-width:700px) {
      .page { padding-top:28px; }
      .intro { padding:22px 24px; }
      .scheduleBody { padding:24px 26px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="intro">
      <div class="eyebrow">Programación premium</div>
      <div class="heroTitleRow"><span id="eventCount" class="heroCount">0</span><span class="heroLabel">eventos de hoy</span></div>
      <div id="dateLine" class="dateLine"></div>
    </section>

    <div id="status" class="status"><span class="spinner" aria-hidden="true"></span><span>Cargando cartelera…</span></div>

    <section id="eventCard" class="eventCard" hidden>
      <div class="sectionLabel"><span>Evento destacado</span><span class="live">Hoy</span></div>
      <div class="eventImageWrap"><img id="eventImage" class="eventImage" alt="Evento destacado de M17LIV3" draggable="false"></div>
    </section>

    <section id="scheduleCard" class="scheduleCard" hidden>
      <div class="sectionLabel"><span>Programación</span><span class="brandMini">M17LIV3</span></div>
      <div class="scheduleBody"><div id="scheduleTableHost"></div><div id="scheduleText" class="scheduleText"></div></div>
    </section>

    <section id="emptyCard" class="scheduleCard" hidden>
      <div class="empty">
        <div class="emptyIcon">📺</div>
        <strong>La cartelera de hoy estará disponible próximamente</strong>
        <span>Vuelve a consultar este enlace un poco más tarde.</span>
      </div>
    </section>

    <footer class="footer">
      <div>M17LIV3 · Tu entretenimiento en un solo lugar</div>
      <div id="updated" class="updated"></div>
    </footer>
  </main>

  <script src="config.js"></script>
  <!-- Cartelera Premium V3.3.6 · vaciado visual automático al cambiar de día -->
  <script>
    (function () {
      'use strict';

      var cfg = window.M17_CONFIG || {};
      var binId = cfg.cartBinId || '';
      var binKey = cfg.cartKey || '';
      var endpoint = 'https://api.jsonbin.io/v3/b/' + encodeURIComponent(binId);
      var statusEl = document.getElementById('status');
      var eventCard = document.getElementById('eventCard');
      var eventImage = document.getElementById('eventImage');
      var scheduleCard = document.getElementById('scheduleCard');
      var scheduleText = document.getElementById('scheduleText');
      var emptyCard = document.getElementById('emptyCard');
      var updatedEl = document.getElementById('updated');

      function headers() {
        return {
          'X-Master-Key': binKey,
          'X-Access-Key': binKey,
          'Cache-Control': 'no-cache'
        };
      }

      function todayKey() {
        var parts = new Intl.DateTimeFormat('en-CA', {
          timeZone:'Europe/Madrid',
          year:'numeric', month:'2-digit', day:'2-digit'
        }).formatToParts(new Date());
        function get(type) {
          var part = parts.find(function(item){ return item.type === type; });
          return part ? part.value : '';
        }
        return get('year') + '-' + get('month') + '-' + get('day');
      }

      function setDate() {
        var text = new Intl.DateTimeFormat('es-ES', {
          timeZone:'Europe/Madrid',
          weekday:'long', day:'numeric', month:'long', year:'numeric'
        }).format(new Date());
        document.getElementById('dateLine').textContent = text;
      }

      function setLoading(loading) {
        if (loading) {
          statusEl.hidden = false;
          statusEl.innerHTML = '<span class="spinner" aria-hidden="true"></span><span>Cargando cartelera…</span>';
        }
      }


      function escapeHtml(value) {
        return String(value == null ? '' : value).replace(/[&<>"']/g, function (c) {
          return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
        });
      }

      function parseCarteleraTable(text) {
        var lines = String(text || '').split(/\r?\n/).map(function(line){
          return String(line || '').replace(/\uFE0F/g,'').trim();
        }).filter(Boolean);

        var currentSport = 'Otros';
        var current = null;
        var events = [];

        function finish() {
          if (current) events.push(current);
          current = null;
        }

        lines.forEach(function(line){
          if (/^[.\-_=·•:~*]{5,}$/.test(line)) return;
          if (/^[^\p{L}\p{N}]{5,}$/u.test(line)) return;

          var header = line.replace(/^[^\p{L}\p{N}]+/u,'').trim();
          if (
            !/^⏰/.test(line) &&
            !/^📺/.test(line) &&
            !/^🗂/.test(line) &&
            !/^\d{1,2}:\d{2}/.test(line) &&
            header &&
            header === header.toUpperCase() &&
            header.length <= 42
          ) {
            finish();
            currentSport = header;
            return;
          }

          var ev = line.match(/^(?:⏰\s*)?(\d{1,2}:\d{2})\s*[–—-]\s*(.+)$/);
          if (ev) {
            finish();
            current = {
              sport: currentSport,
              time: ev[1],
              title: ev[2].trim(),
              channel: '',
              folder: ''
            };
            return;
          }

          if (!current) return;

          if (/^📺/.test(line)) {
            current.channel = line.replace(/^📺\s*/,'').trim();
            return;
          }

          if (/^🗂/.test(line)) {
            current.folder = line.replace(/^🗂\s*/,'').trim();
            return;
          }

          if (!/^(Final|Jornada|Etapa|Día)\b/i.test(line)) {
            current.title += ' · ' + line;
          }
        });

        finish();
        return events;
      }


      function eventDateTimeToday(timeText) {
        var now = new Date();
        var parts = String(timeText || '').split(':');
        return new Date(
          now.getFullYear(), now.getMonth(), now.getDate(),
          Number(parts[0] || 0), Number(parts[1] || 0), 0, 0
        );
      }

      function humanCountdown(ms) {
        var mins = Math.max(0, Math.floor(ms / 60000));
        var h = Math.floor(mins / 60);
        var m = mins % 60;
        if (h <= 0) return 'Empieza en ' + m + ' min';
        if (m === 0) return 'Empieza en ' + h + ' h';
        return 'Empieza en ' + h + ' h ' + m + ' min';
      }

      function estimatedDurationMinutes(sportText, titleText) {
        var sport = String(sportText || '').toUpperCase();
        var title = String(titleText || '').toUpperCase();

        if (/FÚTBOL SALA|FUTBOL SALA|FUTSAL/.test(sport)) return 105;
        if (/FÚTBOL|FUTBOL/.test(sport)) return 120;
        if (/BALONCESTO|BASKET/.test(sport)) return 135;
        if (/BALONMANO|HANDBALL/.test(sport)) return 90;
        if (/VOLEIBOL|VOLLEY/.test(sport)) return 120;
        if (/RUGBY/.test(sport)) return 120;
        if (/HOCKEY/.test(sport)) return 135;
        if (/TENIS|TENNIS/.test(sport)) return 150;

        if (/F1|FÓRMULA|FORMULA|MOTOGP|MOTOCICLISMO|INDYCAR|MOTOR/.test(sport)) {
          if (/CLASIFIC|QUALIFY|QUALIFYING/.test(title)) return 90;
          if (/ENTRENAMIENTO|PRÁCTICA|PRACTICA|FREE PRACTICE|FP[123]/.test(title)) return 75;
          if (/SPRINT/.test(title)) return 75;
          return 120;
        }

        if (/SNOOKER/.test(sport)) return 180;
        if (/NATACIÓN|NATACION|ATLETISMO/.test(sport)) return 120;
        if (/CICLISMO/.test(sport)) return 240;
        if (/GOLF/.test(sport)) return 300;
        if (/HÍPICA|HIPICA/.test(sport)) return 120;
        if (/PÁDEL|PADEL/.test(sport)) return 120;

        return 120;
      }

      function eventStatusFor(timeText, sportText, titleText) {
        var now = new Date();
        var start = eventDateTimeToday(timeText);
        var diff = start.getTime() - now.getTime();

        if (diff > 30 * 60 * 1000) {
          return {kind:'upcoming', text:humanCountdown(diff)};
        }
        if (diff > 0) {
          return {kind:'soon', text:humanCountdown(diff)};
        }

        var durationMs = estimatedDurationMinutes(sportText, titleText) * 60 * 1000;
        var elapsed = now.getTime() - start.getTime();

        if (elapsed < durationMs) {
          return {kind:'live', text:'En curso'};
        }

        return {kind:'finished', text:'Finalizado'};
      }

      function renderCarteleraTable(text) {
        var host = document.getElementById('scheduleTableHost');
        var events = parseCarteleraTable(text);
        var countEl = document.getElementById('eventCount');
        if (countEl) countEl.textContent = String(events.length);

        if (!events.length) {
          host.innerHTML = '';
          return;
        }

        var groups = new Map();
        events.forEach(function(ev){
          if (!groups.has(ev.sport)) groups.set(ev.sport, []);
          groups.get(ev.sport).push(ev);
        });

        var body = '';

        groups.forEach(function(items, sport){
          body += '<tr class="sportGroupRow"><td colspan="5">' +
            escapeHtml(sport) +
            '<small>' + items.length + ' ' + (items.length === 1 ? 'evento' : 'eventos') + '</small></td></tr>';

          items.forEach(function(ev){
            var status = eventStatusFor(ev.time, sport, ev.title);
            body += '<tr>' +
              '<td class="timeCell">' + escapeHtml(ev.time) + '</td>' +
              '<td class="eventCell">' + escapeHtml(ev.title) + '</td>' +
              '<td class="channelCell">' + escapeHtml(ev.channel) + '</td>' +
              '<td class="folderCell">' + (ev.folder ? '📁 ' + escapeHtml(ev.folder) : '') + '</td>' +
              '<td class="statusCell"><span class="eventStatus ' + status.kind + '"><span class="statusDot"></span>' + escapeHtml(status.text) + '</span></td>' +
            '</tr>';
          });
        });

        host.innerHTML =
          '<div class="scheduleTableWrap">' +
            '<table class="scheduleTable">' +
              '<thead><tr><th>Hora</th><th>Evento</th><th>Canal</th><th>Buscar en</th><th style="text-align:right">Estado</th></tr></thead>' +
              '<tbody>' + body + '</tbody>' +
            '</table>' +
          '</div>';
      }

      function render(record) {
        var publishedDate = String(record.eventos_fecha || '').trim();

        /*
          V3.3.6: la cartelera solo es visible durante el día para el que
          fue publicada. Al llegar a las 00:00 de Madrid, la fecha deja de
          coincidir y ocultamos texto e imagen sin borrar el registro.
        */
        if (!publishedDate || publishedDate !== todayKey()) {
          statusEl.hidden = true;
          eventCard.hidden = true;
          scheduleCard.hidden = true;
          emptyCard.hidden = false;
          eventImage.removeAttribute('src');
          scheduleText.textContent = '';
          document.getElementById('scheduleTableHost').innerHTML = '';
          var emptyCountEl = document.getElementById('eventCount');
          if (emptyCountEl) emptyCountEl.textContent = '0';
          updatedEl.textContent = '';
          return false;
        }

        var text = String(record.texto || '').trim();
        var imageUrl = String(record.imagen_dia || '').trim();

        statusEl.hidden = true;
        eventCard.hidden = !imageUrl;
        scheduleCard.hidden = !text;
        if (!text) {
          document.getElementById('scheduleTableHost').innerHTML = '';
          var countEl = document.getElementById('eventCount'); if (countEl) countEl.textContent = '0';
        }
        emptyCard.hidden = !!(imageUrl || text);

        if (imageUrl) {
          eventImage.src = imageUrl;
          eventImage.onerror = function () { eventCard.hidden = true; };
        } else {
          eventImage.removeAttribute('src');
        }
        scheduleText.textContent = text;
        renderCarteleraTable(text);
        updatedEl.textContent = 'Actualizado: ' + new Intl.DateTimeFormat('es-ES', {
          timeZone:'Europe/Madrid',
          hour:'2-digit', minute:'2-digit'
        }).format(new Date());
        return true;
      }

      async function incrementVisit(record) {
        try {
          var sessionKey = 'm17liv3_cartelera_visit_' + todayKey();
          if (sessionStorage.getItem(sessionKey)) return;
          var visits = record.visits && typeof record.visits === 'object' ? record.visits : {};
          visits[todayKey()] = Number(visits[todayKey()] || 0) + 1;
          record.visits = visits;
          var response = await fetch(endpoint, {
            method:'PUT',
            headers:Object.assign({'Content-Type':'application/json'}, headers()),
            body:JSON.stringify(record)
          });
          if (response.ok) sessionStorage.setItem(sessionKey, '1');
        } catch (e) {
          // El contador nunca debe impedir que se vea la cartelera.
        }
      }


      var visibleDayKey = todayKey();

      setInterval(function(){
        var currentDayKey = todayKey();

        /* Si la página quedó abierta a medianoche, se vacía y consulta
           una vez el nuevo día para evitar mostrar la programación anterior. */
        if (currentDayKey !== visibleDayKey) {
          visibleDayKey = currentDayKey;
          setDate();
          render({ eventos_fecha:'', texto:'', imagen_dia:'' });
          loadCartelera();
          return;
        }

        var text = scheduleText.textContent || '';
        if (text) renderCarteleraTable(text);
      }, 60000);

      async function loadCartelera() {
        setLoading(true);
        eventCard.hidden = true;
        scheduleCard.hidden = true;
        emptyCard.hidden = true;
        try {
          if (!binId || !binKey) throw new Error('Configuración incompleta');
          var response = await fetch(endpoint + '/latest?t=' + Date.now(), { headers:headers(), cache:'no-store' });
          if (!response.ok) throw new Error('No se pudo cargar la cartelera');
          var data = await response.json();
          var record = data.record || {};
          var isCurrentPublication = render(record);
          if (isCurrentPublication) incrementVisit(record);
        } catch (error) {
          statusEl.hidden = false;
          statusEl.innerHTML = '<span>⚠️ No se pudo cargar la cartelera. Vuelve a abrir la página para intentarlo de nuevo.</span>';
          updatedEl.textContent = '';
        } finally {
        }
      }



      // Protección básica frente a copia/selección y guardado casual de imágenes.
      function blockInteraction(event) {
        event.preventDefault();
      }
      document.addEventListener('contextmenu', blockInteraction, { passive:false });
      document.addEventListener('dragstart', blockInteraction, { passive:false });
      document.addEventListener('selectstart', blockInteraction, { passive:false });
      document.addEventListener('copy', blockInteraction, { passive:false });
      document.addEventListener('cut', blockInteraction, { passive:false });
      document.addEventListener('keydown', function (event) {
        var key = String(event.key || '').toLowerCase();
        if ((event.ctrlKey || event.metaKey) && (key === 'c' || key === 'x' || key === 's' || key === 'u')) {
          event.preventDefault();
        }
      });

      setDate();
      loadCartelera();
    }());
  </script>
</body>
</html>
